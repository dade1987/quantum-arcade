name: CI

# Every push and every pull request must pass the same checks you run locally with
# `npm run test:all`. If it is green here, it is green everywhere.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: PHP backend (100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, dom, curl
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Tests with coverage
        run: php artisan test --coverage --min=100
        env:
          XDEBUG_MODE: coverage

  frontend:
    name: Game engine, validator and languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up PHP (the validator needs it to check the .php files)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: npm ci

      - name: Unit tests with coverage
        run: node --test --experimental-test-coverage tests/js/unit/

      - name: Validate every file
        run: node tools/validate.mjs

      - name: Mathematical checks of the simulator
        run: node tools/test-math.mjs

  e2e:
    name: End-to-end (Playwright, desktop and phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, dom, curl

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: End-to-end tests
        run: npx playwright test

      - name: Keep the report if something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/report/
            test-results/
          retention-days: 7
