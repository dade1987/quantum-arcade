name: Collaudo

# Ogni push e ogni pull request devono passare gli stessi controlli che si
# lanciano in locale con `npm run test:all`. Se qui è verde, è verde ovunque.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend PHP (copertura 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, dom, curl
          coverage: xdebug

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepara l'ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Test con copertura
        run: php artisan test --coverage --min=100
        env:
          XDEBUG_MODE: coverage

  frontend:
    name: Motore del gioco, validatore e lingue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepara PHP (serve al validatore per controllare i file .php)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: npm ci

      - name: Test unitari con copertura
        run: node --test --experimental-test-coverage tests/js/unit/

      - name: Validatore di tutti i file
        run: node tools/validate.mjs

      - name: Verifiche matematiche del simulatore
        run: node tools/test-math.mjs

  e2e:
    name: End-to-end (Playwright, desktop e telefono)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, dom, curl

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Prepara l'ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Test end-to-end
        run: npx playwright test

      - name: Salva il rapporto se qualcosa fallisce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapporto-playwright
          path: |
            tests/report/
            test-results/
          retention-days: 7
