<!doctype html>
<html lang="es" data-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0·2. Cuadrícula, flechas y grados — Quantum Arcade</title>
<meta name="description" content="Coordenadas (x,y), flechas y ángulos en grados: las bases geométricas para entender los números complejos y la fase cuántica, explicadas con dos minijuegos.">
<link rel="canonical" href="https://quantumarcade.it/es/lecciones/00-cuadricula.html">
<link rel="alternate" hreflang="it" href="https://quantumarcade.it/lezioni/00-griglia.html">
<link rel="alternate" hreflang="en" href="https://quantumarcade.it/en/lessons/00-grid.html">
<link rel="alternate" hreflang="es" href="https://quantumarcade.it/es/lecciones/00-cuadricula.html">
<link rel="alternate" hreflang="x-default" href="https://quantumarcade.it/lezioni/00-griglia.html">
<link rel="stylesheet" href="../../css/style.css">
<link rel="icon" type="image/svg+xml" href="../../assets/logo.svg">
</head>
<body>
<div id="app"></div>
<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { gridLab, angleLab } from '../../js/widgets/basicmath.js';

const L = renderLesson({
  id: '00-griglia',
  lead: `Dos herramientas y ya está: decir <b>dónde</b> está un punto (coordenadas) y decir <b>cuánto ha girado</b> una flecha (grados).
         Con esas dos, dentro de pocos niveles, entenderás los números complejos sin darte cuenta.`,

  steps: [
    {
      t: 'Coordenadas: dos números para un punto',
      html: `<p>Si te digo "el tesoro está en 3", no basta: ¿tres qué? Hay que decir <b>cuánto a la derecha</b> y <b>cuánto hacia arriba</b>.
             Por eso se usan dos números, siempre en este orden: <b>(x, y)</b>.</p>
             <ul>
               <li><b>x</b> = desplazamiento horizontal. Positivo a la derecha, negativo a la izquierda.</li>
               <li><b>y</b> = desplazamiento vertical. Positivo hacia arriba, negativo hacia abajo.</li>
             </ul>
             <p>El punto (3, 2) quiere decir: parte del centro, da 3 pasos a la derecha y 2 hacia arriba.
             El punto (−4, 1): 4 pasos a la izquierda y 1 hacia arriba.</p>
             <p><b>Juega:</b> el objetivo está escondido; mueve los deslizadores (o haz clic directamente en la cuadrícula) y dispara.
             Después de cada tiro recibes una pista.</p>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'battaglia', title: 'Hundir la flota', text: 'acierta a 3 objetivos.', xp: 30 });
        el.appendChild(m.root);
        gridLab(el, { need: 3, onWin: () => m.complete() });
      },
      after: `<div class="callout key"><b>La conexión que usarás en todo el curso:</b> el par (x, y) describe
              tanto un <b>punto</b> como la <b>flecha</b> que llega hasta él partiendo del centro. Punto y flecha son la misma
              información. En el nivel 8 esa flecha se llamará <b>número complejo</b>: x será la "parte real"
              e y la "parte imaginaria". Nada nuevo: solo un nombre distinto para este juego.</div>`,
    },
    {
      t: 'Grados: cuánto ha girado una flecha',
      html: `<p>Una vuelta completa son <b>360°</b>. Es una convención antigua (los babilonios contaban de sesenta en sesenta),
             pero cómoda porque 360 se divide bien: mitad = 180°, un cuarto = 90°, un octavo = 45°.</p>
             <table class="table">
               <tr><th>Ángulo</th><th>Parte de vuelta</th><th>Adónde apunta la flecha</th></tr>
               <tr><td class="mono">0°</td><td>nada</td><td>a la derecha →</td></tr>
               <tr><td class="mono">90°</td><td>un cuarto</td><td>hacia arriba ↑</td></tr>
               <tr><td class="mono">180°</td><td>mitad</td><td>a la izquierda ←</td></tr>
               <tr><td class="mono">270°</td><td>tres cuartos</td><td>hacia abajo ↓</td></tr>
               <tr><td class="mono">360°</td><td>vuelta entera</td><td>a la derecha → (¡otra vez!)</td></tr>
             </table>
             <div class="callout"><b>La regla más importante:</b> <b>360° = 0°</b>. Tras una vuelta completa has vuelto
             exactamente al punto de partida. Los ángulos son <b>circulares</b>: 370° es como 10°, y −90° es como 270°.</div>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'gradi', title: 'El transportador humano', text: 'acierta 3 ángulos pedidos.', xp: 30 });
        el.appendChild(m.root);
        angleLab(el, { need: 3, onWin: () => m.complete() });
      },
    },
    {
      t: 'Por qué estas dos cosas juntas son potentísimas',
      html: `<p>Una flecha se puede describir de <b>dos maneras distintas pero equivalentes</b>:</p>
             <div class="grid-2">
               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>Manera A — coordenadas</h3>
                 <p class="mb0 dim">"ve 3 a la derecha y 4 hacia arriba" → <b>(3, 4)</b><br>
                 Cómoda para <b>sumar</b> dos flechas: sumas las x entre sí y las y entre sí.</p></div>
               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>Manera B — longitud y ángulo</h3>
                 <p class="mb0 dim">"de longitud 5, girada 53°" → <b>(5 ; 53°)</b><br>
                 Cómoda para <b>rotar</b>: basta con sumar grados a los grados.</p></div>
             </div>
             <p>La longitud se calcula con Pitágoras: √(3² + 4²) = √25 = <b>5</b>.
             En el curso usaremos <b>las dos</b> maneras, eligiendo cada vez la más cómoda — igual que dirías
             "calle Roma 5" o "200 metros al norte del bar" para indicar el mismo sitio.</p>`,
    },
    {
      t: '💡 Pruébalo tú',
      html: `<div class="callout think">
        <p><b>1.</b> ¿Qué coordenadas tiene el punto opuesto a (3, 2) respecto al centro? ¿Y qué ángulo forman entre sí las dos flechas?</p>
        <p><b>2.</b> Una flecha de longitud 1 girada 90°: ¿cuáles son sus coordenadas? ¿Y a 180°?</p>
        <p><b>3.</b> Si sumas las flechas (2, 1) y (−2, −1), ¿qué obtienes? Intenta imaginarlo antes de calcularlo.</p>
        <p class="mb0"><b>4.</b> Si una flecha gira 45° ocho veces seguidas, ¿dónde acaba? <span class="muted">(45 × 8 = 360 → en el punto de partida)</span></p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'El punto (−2, 3) está…', options: ['2 a la derecha y 3 abajo', '2 a la izquierda y 3 arriba', '3 a la izquierda y 2 arriba', 'fuera de la cuadrícula'], correct: 1,
      why: 'La primera coordenada es siempre la x (horizontal) y el signo menos quiere decir "a la izquierda"; la segunda es la y, positiva, así que hacia arriba.' },
    { q: 'Una flecha girada 180° apunta…', options: ['hacia arriba', 'a la derecha', 'a la izquierda', 'hacia abajo'], correct: 2,
      why: 'Media vuelta: al lado contrario respecto a 0°, es decir a la izquierda. Es lo mismo que multiplicar por −1.' },
    { q: '¿Cuánto da 360° + 90°, como dirección?', options: ['450°, una dirección nueva', 'lo mismo que 90°', 'lo mismo que 180°', 'lo mismo que 0°'], correct: 1,
      why: 'Los ángulos son circulares: una vuelta completa te devuelve al punto de partida, así que 450° apunta exactamente como 90°.' },
    { q: '¿Cuánto mide la flecha de coordenadas (3, 4)?', options: ['7', '5', '12', '3,4'], correct: 1,
      why: 'Pitágoras: √(9 + 16) = √25 = 5. La longitud no es la suma de las coordenadas.' },
  ],

  outro: `<div class="callout ok"><b>¡Hecho!</b> Sabes decir dónde está un punto y cuánto ha girado una flecha.
          Ahora juntamos las dos cosas y vemos qué le pasa a un punto que <b>gira en el círculo</b>:
          de ahí salen el seno, el coseno y todas las ondas del curso.</div>`,
});
</script>
</body>
</html>
