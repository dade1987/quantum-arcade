<title>10 · Bernstein–Vazirani: la cadena secreta — Quantum Arcade</title>
<meta name="description" content="Adivinar un secreto de n bits con una sola consulta: escribir una cadena entera en las fases y releerla con una transformada de Hadamard–Walsh.">

<body>
<div id="app"></div>
<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { stepper } from '../../js/core/formula.js';
import { bvLab } from '../../js/widgets/algos.js';

const L = renderLesson({
  id: '10-bernstein',
  lead: `Mismo esquema que el nivel 9, problema más concreto: hay una <b>cadena secreta</b> y tienes que adivinarla.
         Clásicamente hace falta una pregunta por bit. Cuánticamente: <b>una sola, siempre</b>.`,

  steps: [
    {
      t: 'El problema del secreto',
      html: `<p>Hay una cadena secreta <b>s</b> de n bits (por ejemplo <code>1011</code>). El oráculo no te la dice,
             pero responde a esta pregunta: dada una entrada x, <b>cuántos bits tienen en común s y x</b>… pero solo
             si son <b>pares o impares</b>.</p>
             <div class="formula">f(x) = s · x mod 2 &nbsp;&nbsp;<span class="muted">(suma de los bits en común, tomada par/impar)</span></div>
             <p>Ejemplo con s = <code>1011</code>:</p>
             <pre><code>x = 0001 →  bits en común: 1     → impar → f = 1
x = 0110 →  bits en común: 1     → impar → f = 1
x = 1010 →  bits en común: 2     → par   → f = 0</code></pre>
             <p><b>Estrategia clásica:</b> pregunta <code>0001</code> y descubres el último bit de s. Luego <code>0010</code> y descubres
             el penúltimo. Y así sucesivamente: <b>n preguntas</b> para n bits. No se puede hacer mejor clásicamente,
             ni con suerte: cada respuesta es un solo bit de información.</p>`,
    },
    {
      t: 'La solución cuántica: una pregunta',
      html: `<p>Los tres movimientos son los mismos del nivel 9 — <b>H, oráculo, H</b> — pero el resultado es mucho más bonito:
             en vez de un sí/no, sale <b>la cadena secreta entera</b>.</p>
             <p>Mira las barras: tras la segunda Hadamard <b>una sola</b> está al 100%, y su etiqueta <b>es</b> el secreto.</p>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'bv', title: 'Roba el secreto', text: 'encuentra la cadena secreta con la consulta cuántica.', xp: 55 });
        el.appendChild(m.root);
        bvLab(el, { n: 4, onWin: () => m.complete() });
      },
    },
    {
      t: 'Por qué sale justo s (y no otra cosa)',
      html: `<p>La cuenta es más sencilla de lo que parece, y vale la pena hacerla porque es <b>la misma cuenta de la QFT</b>
             en versión reducida.</p>`,
      mount: el => {
        stepper(el, [
          { h: 'Tras la primera H', html: 'Todas las 2^n posibilidades con la misma amplitud. Llamémosla "rejilla plana".' },
          { h: 'Tras el oráculo', html: 'Cada posibilidad x se lleva el signo (−1)^(s·x). El resultado es un <b>tablero de signos</b>, y el dibujo de ese tablero depende <b>únicamente</b> de s. En la práctica: <b>s ha quedado escrito en las fases</b>.' },
          { h: 'Qué hace la segunda H', html: 'La Hadamard sobre n cúbits convierte cada estado |y⟩ en una combinación con signos (−1)^(x·y). Sumando sobre todas las x, la amplitud del estado |y⟩ se vuelve proporcional a<br><code>Σ_x (−1)^(s·x + x·y)</code>' },
          { h: 'La cancelación', html: 'Si <b>y ≠ s</b>, los exponentes son mitad pares y mitad impares: mitad +1 y mitad −1 → suma <b>cero</b>. Interferencia destructiva perfecta.<br>Si <b>y = s</b>, los exponentes se anulan entre sí (s·x + x·s es siempre par) → todos +1 → suma <b>máxima</b>.' },
          { h: 'Resultado', html: 'Amplitud 1 en |s⟩, cero en todo lo demás. Mides una vez y lees <b>s</b>. Sin repeticiones, sin probabilidad de error.' },
          { h: 'La conexión con lo que viene', html: 'Esto ya es una <b>transformada de Fourier</b>, en su versión más simple (la de ±1, llamada transformada de Hadamard–Walsh). En el nivel 18 haremos lo mismo con flechas que apuntan en <b>todas</b> las direcciones en vez de solo + y −: esa será la QFT.' },
        ], { doneLabel: '¡Clarísimo!' });
      },
    },
    {
      t: 'Por qué esto cuenta más que Deutsch–Jozsa',
      html: `<p>A Deutsch–Jozsa se le gana fácilmente con un algoritmo clásico <b>probabilístico</b> (unas pocas preguntas al azar
             y ya casi estás seguro). A Bernstein–Vazirani no: incluso aceptando una pequeña probabilidad de error,
             clásicamente hacen falta <b>del orden de n</b> preguntas, porque cada respuesta contiene un solo bit de información.</p>
             <div class="callout key">Bernstein–Vazirani es por tanto el primer ejemplo de ventaja cuántica <b>sólida</b>:
             n preguntas contra 1, incluso frente al mejor algoritmo clásico aleatorizado.
             El salto es "solo" lineal, pero es real — y la técnica (escribir una cadena entera en las fases y leerla con
             una transformada) es exactamente la que, aplicada a las <b>periodicidades</b>, llevará a Simon y a Shor.</div>
             <p class="dim small">Nota de seguridad informática: no, esto no "rompe las contraseñas". El oráculo de aquí es una
             función matemática muy especial con una estructura lineal. Las funciones que se usan en criptografía están diseñadas
             justamente para no tener estructuras de este tipo.</p>`,
    },
    {
      t: '💡 Pruébalo tú',
      html: `<div class="callout think">
        <p><b>1.</b> En el juego, ¿cuántas preguntas clásicas hacen falta para un secreto de 4 bits? ¿Y para uno de 64 bits?</p>
        <p><b>2.</b> Si el secreto fuera <code>0000</code>, ¿qué respondería el oráculo a cualquier pregunta?
           ¿Y funcionaría igualmente el método cuántico?</p>
        <p><b>3.</b> Intenta explicar con tus palabras por qué todas las barras menos una se cancelan.</p>
        <p class="mb0"><b>4.</b> Pregunta de inventor: ¿y si el oráculo, en vez de esconder una cadena, escondiera
           una <b>periodicidad</b> ("f(x) = f(x + r) para cierto r")? ¿Qué tendrías que poner en lugar de las Hadamard finales?
           <i>(Si respondes "una transformada de Fourier", acabas de inventar medio algoritmo de Shor.)</i></p>
      </div>`,
    },
  ],

  quiz: [
    { q: '¿Cuántas consultas hacen falta clásicamente para encontrar una cadena secreta de n bits?',
      options: ['1', 'n', 'log n', '2^n'], correct: 1,
      why: 'Cada respuesta vale un bit de información: hacen falta n preguntas, una por bit. Cuánticamente basta con una.' },
    { q: 'Tras la segunda Hadamard, el estado de Bernstein–Vazirani es…',
      options: ['una superposición uniforme', 'exactamente |s⟩ con probabilidad 100%', 'entrelazado', 'aleatorio'], correct: 1,
      why: 'Todas las demás amplitudes se cancelan por interferencia destructiva: solo queda la cadena secreta.' },
    { q: '¿Qué hace el oráculo en este algoritmo?',
      options: ['revela s directamente', 'escribe s en el dibujo de los signos (las fases)', 'mide los cúbits', 'crea entrelazamiento'], correct: 1,
      why: 'El signo (−1)^(s·x) depende de s: el secreto queda "dibujado" en las fases, invisible para las probabilidades pero legible por la interferencia.' },
    { q: 'La transformada que realizan n Hadamard en paralelo se llama…',
      options: ['transformada de Fourier cuántica', 'transformada de Hadamard–Walsh', 'transformada de Laplace', 'difusión de Grover'], correct: 1,
      why: 'Es la versión "solo + y −" de la transformada de Fourier. La QFT (nivel 18) es la misma idea con fases en todas las direcciones.' },
  ],

  outro: `<div class="callout ok"><b>Lo que te llevas a casa:</b> se puede escribir una <b>cadena entera</b> en las fases y
          releerla con una transformada; n preguntas → 1. Nivel siguiente: ¿y si en vez de una estructura escondida
          tuviéramos que buscar <b>una aguja en un pajar sin estructura</b>?</div>`,
});
</script>
</body>
