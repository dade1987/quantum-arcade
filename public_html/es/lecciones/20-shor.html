<title>20. BOSS — Shor: del periodo a los factores — Quantum Arcade</title>
<meta name="description" content="El algoritmo de Shor explicado y jugado paso a paso: de la factorización al periodo de a^x mod N, QFT, medida, fracciones continuas y MCD. Con simulador interactivo.">

<body>
<div id="app"></div>
<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { stepper } from '../../js/core/formula.js';
import { shorLab } from '../../js/widgets/qft.js';

const L = renderLesson({
  id: '20-shor',
  lead: `El jefe final de la teoría. Shor (1994) es el algoritmo que convirtió la computación cuántica en un asunto de Estado:
         factoriza números enormes en tiempo polinómico, y con ellos manda a la jubilación a la criptografía RSA.
         Lo bonito es que <b>casi todo son matemáticas clásicas</b>: la parte cuántica es una sola, y ya la conoces.`,

  steps: [
    {
      t: 'Por qué factorizar es difícil (y por qué nos interesa)',
      html: `<p>Multiplicar es fácil: 3 × 5 = 15, lo hace un niño. Lo contrario — dado 15, encontrar 3 y 5 — es fácil
             solo porque el número es minúsculo. Con un número de 600 cifras, el mejor algoritmo clásico conocido
             tardaría <b>más que la edad del universo</b>.</p>
             <p>Sobre esta asimetría se sostiene <b>RSA</b>, es decir, buena parte de la seguridad de internet:
             la clave pública es un número enorme, la clave privada son sus factores.</p>
             <div class="callout warn"><b>¿Por qué se habla de ello hoy, si los ordenadores cuánticos aún son pequeños?</b>
             Por el ataque <b>"harvest now, decrypt later"</b> (cosecha ahora, descifra después): quien intercepta hoy tráfico cifrado puede conservarlo
             y descifrarlo dentro de diez o veinte años. Para los datos que deben seguir siendo secretos mucho tiempo (sanitarios, militares,
             industriales) la amenaza es <b>ya ahora</b>. Es el motivo por el que el NIST estandarizó
             algoritmos <b>poscuánticos</b> en 2024.</div>`,
    },
    {
      t: 'La jugada genial: de factores a periodo',
      html: `<p>Shor no ataca la factorización de frente. La <b>transforma</b> en otro problema:</p>
             <div class="callout key">Para factorizar N, encuentra el <b>periodo r</b> de la función
             <code>f(x) = a^x mod N</code>, donde a es un número elegido al azar.</div>
             <p>"mod N" quiere decir "coge el resto de la división por N". Hagamos un ejemplo con a = 7 y N = 15:</p>
             <pre><code>x:      0   1   2   3   4   5   6   7   8 …
7^x:    1   7  49 343 2401 …
mod 15: 1   7   4  13   1   7   4  13   1 …
        └──── se repite cada 4 ────┘      →  r = 4</code></pre>
             <p>El número 1 vuelve tras <b>4</b> pasos: el periodo es r = 4. Y a partir de aquí los factores se obtienen con dos cuentas
             que ya se hacían en el siglo XIX.</p>`,
      mount: el => {
        stepper(el, [
          { h: 'Paso 1', html: 'Tenemos r = 4, que es <b>par</b> (hace falta que lo sea).' },
          { h: 'Paso 2', html: 'Calculamos <code>a^(r/2) mod N</code> = 7² mod 15 = 49 mod 15 = <b>4</b>.' },
          { h: 'Paso 3', html: 'Por qué funciona: sabemos que a^r ≡ 1, así que (a^(r/2))² − 1 ≡ 0, es decir<br><code>(a^(r/2) − 1)(a^(r/2) + 1) ≡ 0 mod N</code>.<br>El producto es múltiplo de N, así que los dos factores "se reparten" los factores de N.' },
          { h: 'Paso 4', html: 'Basta con calcular los máximos comunes divisores:<br><code>MCD(4 − 1, 15) = MCD(3, 15) = <b>3</b></code><br><code>MCD(4 + 1, 15) = MCD(5, 15) = <b>5</b></code>' },
          { h: 'Hecho', html: '<b>15 = 3 × 5.</b> Y el MCD se calcula en un pispás con el algoritmo de Euclides (¡hacia el 300 a. C.!).' },
          { h: 'Cuándo no funciona', html: 'Si r es <b>impar</b>, o si a^(r/2) ≡ −1 mod N, el intento está desperdiciado: se elige otra a y se vuelve a empezar. Pasa en menos de la mitad de los casos, así que bastan pocos intentos.' },
        ], { doneLabel: '¡Matemáticas clásicas claras!' });
      },
    },
    {
      t: '¿Y el ordenador cuántico dónde entra?',
      html: `<p>En un solo punto: <b>encontrar el periodo r</b>. Clásicamente tendrías que calcular a^x mod N para una x tras otra
             hasta que vuelva a 1 — y para números grandes son exponencialmente muchos intentos.</p>
             <p>Cuánticamente se hace así:</p>
             <ol>
               <li>Se pone el primer registro en <b>superposición uniforme</b> sobre todas las x (Hadamard: nivel 3).</li>
               <li>Se calcula <b>a^x mod N</b> en superposición, escribiendo el resultado en un segundo registro.
                   Ahora los dos registros están <b>entrelazados</b> (nivel 4).</li>
               <li>Se <b>mide el segundo registro</b>. Sale un valor al azar — ¡y no nos importa cuál!
                   El efecto importante es otro: el primer registro <b>colapsa</b> sobre todas y solo las x que dan
                   ese resultado, es decir, sobre un <b>peine</b> de paso r.</li>
               <li>Se aplica la <b>QFT</b> al primer registro: el peine se convierte en <b>picos</b> sobre los múltiplos de M/r (nivel 18).</li>
               <li>Se <b>mide</b>: sale un número y cercano a un múltiplo de M/r.</li>
               <li>Se vuelve a lo clásico: de las <b>fracciones continuas</b> de y/M se obtiene r.</li>
             </ol>
             <div class="callout key"><b>El punto en el que casi todo el mundo se equivoca:</b> la medida del paso 3 parece destruirlo todo.
             Pues no, y es el regalo que habías visto en el nivel 18: <b>el desfase del peine no mueve los picos</b>.
             Salga lo que salga del segundo registro, la información sobre el periodo queda intacta.</div>`,
    },
    {
      t: 'Factoriza con tus propias manos',
      html: `<p>Elige N, elige a, mira la tabla de los restos (las celdas verdes son los puntos en los que vuelve a 1),
             luego pulsa «medir» y sigue los pasos. Si te sale mal, vuelve a medir: forma parte del juego.</p>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'shor', title: 'Rompe RSA (en pequeñito)', text: 'encuentra los factores de un número completando todos los pasos.', xp: 90 });
        el.appendChild(m.root);
        shorLab(el, { onWin: () => m.complete() });
      },
      after: `<div class="callout"><b>Sobre las fracciones continuas:</b> la medida no da una y exactamente igual a un múltiplo de M/r,
              sino un número cercano. Las fracciones continuas son un método clásico para encontrar la fracción <b>más sencilla</b>
              cercana a un número dado: de y/M ≈ k/r se lee el denominador r. Es el mismo método con el que se descubre que
              π ≈ 22/7.</div>`,
    },
    {
      t: 'Cuánto cuesta de verdad (y por qué RSA aún no está rota)',
      html: `<table class="table">
               <tr><th></th><th>Clásico (el mejor conocido)</th><th>Shor</th></tr>
               <tr><td>Tiempo para factorizar un número de b bits</td><td>alrededor de e^(b^{1/3}) — <b>exponencial</b></td><td>alrededor de b³ — <b>polinómico</b></td></tr>
               <tr><td>RSA-2048</td><td>más que la edad del universo</td><td>horas… <b>en un ordenador que todavía no existe</b></td></tr>
             </table>
             <p>Las estimaciones más citadas hablan de algunos <b>millones</b> de cúbits físicos (para obtener algunos miles de cúbits
             "lógicos" corregidos de errores) para atacar RSA-2048. Hoy los mejores procesadores tienen unos cientos
             de cúbits físicos ruidosos. La distancia es enorme — pero la cuenta es de ingeniería, no teórica,
             y baja año tras año.</p>
             <div class="callout ok"><b>La reacción del mundo real:</b> en agosto de 2024 el NIST publicó los primeros
             estándares de criptografía <b>poscuántica</b> (ML-KEM, ML-DSA, SLH-DSA), basados en problemas matemáticos
             que ni Shor ni Grover saben atacar. La migración ya ha empezado: los navegadores y la mensajería modernos
             ya usan intercambios de claves híbridos poscuánticos.</div>`,
    },
    {
      t: '💡 Pruébalo tú',
      html: `<div class="callout think">
        <p><b>1.</b> Con N = 15, prueba <b>todas</b> las a válidas (2, 4, 7, 8, 11, 13, 14): ¿cuáles tienen periodo impar
           y por tanto no funcionan?</p>
        <p><b>2.</b> ¿Por qué a = 1 no sirve para nada? ¿Y por qué a debe cumplir MCD(a, N) = 1?
           <span class="muted">(¡si no lo cumpliera, ya habrías encontrado un factor sin molestar a la cuántica!)</span></p>
        <p><b>3.</b> Con N = 21, ¿qué a da el periodo más corto? ¿Un periodo corto hace el algoritmo más fácil o más difícil?</p>
        <p class="mb0"><b>4.</b> Como inventor: Shor funciona porque la función a^x mod N tiene una <b>estructura periódica escondida</b>.
           ¿Qué otro problema famoso tiene una estructura escondida que la QFT podría hacer emerger?
           <i>(Pista: el logaritmo discreto — de hecho Shor rompe también ese, y con él la criptografía de curvas elípticas.)</i></p>
      </div>`,
    },
  ],

  quiz: [
    { q: '¿A qué problema reduce Shor la factorización?',
      options: ['encontrar el periodo de a^x mod N', 'ordenar una lista', 'buscar en una base de datos', 'sumar números primos'], correct: 0,
      why: 'Hallado el periodo r (par), los factores se obtienen con MCD(a^{r/2} ∓ 1, N): matemáticas clásicas elementales.' },
    { q: '¿Por qué medir el segundo registro no estropea el algoritmo?',
      options: ['porque no se mide de verdad', 'porque el desfase del peine no mueve los picos de la QFT', 'porque el resultado es siempre 1', 'porque los registros no están entrelazados'], correct: 1,
      why: 'Colapsa sobre un peine con desfase aleatorio, pero las probabilidades tras la QFT dependen solo del periodo, no del desfase.' },
    { q: '¿Para qué sirven las fracciones continuas en Shor?',
      options: ['para preparar el estado inicial', 'para obtener el periodo r del número medido y/M', 'para reducir el ruido', 'para calcular el MCD'], correct: 1,
      why: 'Aproximan y/M con la fracción más sencilla k/r: el denominador es el periodo buscado.' },
    { q: '¿Por qué RSA-2048 todavía no ha sido rota por Shor?',
      options: ['porque el algoritmo está equivocado', 'porque hacen falta millones de cúbits físicos corregidos de errores', 'porque RSA es inmune', 'porque está prohibido'], correct: 1,
      why: 'Es un problema de ingeniería (ruido, corrección de errores, escala), no teórico. Por eso ya existen los estándares poscuánticos del NIST de 2024.' },
    { q: '¿Cuál es la contramedida correcta contra Shor?',
      options: ['claves RSA más largas', 'pasar a algoritmos poscuánticos (basados en retículos, en hash…)', 'usar AES-128', 'apagar internet'], correct: 1,
      why: 'Alargar las claves RSA no basta: Shor escala de forma polinómica. Hay que cambiar el problema matemático subyacente.' },
  ],

  outro: `<div class="callout ok"><b>JEFE DERROTADO.</b> Has visto el algoritmo más famoso de la historia de la computación cuántica
          y — lo más importante — sabes <b>por qué</b> funciona: periodicidad → peine → QFT → picos → fracciones continuas → factores.
          Quedan tres cosas: por qué todavía no lo tienes en el bolsillo (ruido), inventar algo tuyo (taller) y el examen.</div>`,
});
</script>
