<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { examLab } from '../../js/widgets/exam.js';

const L = renderLesson({
  id: '24-esame',
  lead: `Último nivel. Treinta preguntas que cubren todo el recorrido, mezcladas al azar.
         Sin límite de tiempo, sin penalización, intentos ilimitados: el objetivo no es ponerte una nota,
         es hacerte <b>rescatar de memoria</b> cada concepto al menos una vez — que es, según la investigación,
         la manera más eficaz de fijarlo.`,

  steps: [
    {
      t: 'Antes de empezar',
      html: `<p>Consejos prácticos, probados:</p>
             <ul>
               <li><b>No releas el curso ahora.</b> Intenta responder de memoria: equivocarse y luego leer la corrección
                   fija el concepto mucho mejor que el repaso pasivo.</li>
               <li>Si una pregunta te bloquea, responde igualmente: al final tendrás la corrección completa, pregunta por pregunta.</li>
               <li>Si bajas del 80%, mira qué temas has fallado, vuelve a jugar <b>esos</b> niveles y repite el examen.
                   No es un suspenso: es el diagnóstico.</li>
             </ul>`,
    },
    {
      t: 'Examen',
      html: ``,
      mount: (el, api) => {
        const m = api.mission({ key: 'esame', title: 'Aprueba el examen', text: 'alcanza al menos el 80% de respuestas correctas.', xp: 120 });
        el.appendChild(m.root);
        examLab(el, { pass: 0.8, onPass: () => m.complete() });
      },
    },
    {
      t: 'Sobre el certificado: qué es y qué no es',
      html: `<div class="callout warn"><b>Transparencia total, porque importa.</b>
             El certificado que generas aquí es un <b>certificado de finalización del curso</b>, emitido por el autor
             (Davide Cavallini) y verificable mediante el código que lleva. <b>No</b> es una certificación emitida
             por un organismo acreditado: declararlo sería falso y te pondría en un aprieto el día en que alguien
             lo comprobara.</div>
             <p><b>¿Entonces para qué sirve de verdad?</b> Para demostrar, de forma concreta y verificable, que has completado un
             recorrido estructurado de 34 niveles sobre un tema técnico nada trivial. En una entrevista, en un CV o en LinkedIn
             vale como <b>prueba de iniciativa y de curiosidad</b>: ponlo, pero descríbelo por lo que es.</p>
             <h3>Si necesitas un título formalmente reconocido</h3>
             <p>Los caminos de verdad son estos, y son independientes de este sitio:</p>
             <ul>
               <li><b>Certificación de IBM sobre Qiskit</b> — examen de pago con insignia digital emitida por IBM.
                   Es la referencia más extendida del sector.</li>
               <li><b>Cursos universitarios en línea con certificado</b> (edX, Coursera) emitidos por centros acreditados.</li>
               <li><b>Másteres y cursos de especialización</b> de universidades sobre computación cuántica.</li>
             </ul>
             <p class="dim small">Nota técnica para los curiosos: un certificado "reconocido" requiere un <b>organismo tercero
             acreditado</b> que asuma la responsabilidad de la evaluación (para la certificación de personas la
             norma de referencia es la ISO/IEC 17024, con acreditación en Italia por parte de Accredia).
             Es un camino posible pero largo y caro, y hasta que no está concluido ningún sitio serio puede declararlo.</p>`,
    },
    {
      t: '¿Y ahora?',
      html: `<div class="callout ok"><b>Si has llegado hasta aquí, sabes de verdad cómo funciona la informática cuántica.</b>
             No "has oído hablar de ella": sabes por qué un cúbit no es una moneda, qué hace una puerta, por qué hace falta
             la interferencia, cómo se construye una QFT y cómo llega Shor a los factores.</div>
             <p>Tres maneras de no pararte:</p>
             <ol>
               <li><b>Vuelve al taller (nivel 22)</b> e intenta batir tus récords. Es el único nivel sin fondo.</li>
               <li><b>Escribe tu primer circuito en Qiskit</b>: después de este curso es casi solo cuestión de sintaxis.</li>
               <li><b>Explícaselo a alguien.</b> Es la prueba definitiva: si consigues hacerle entender la interferencia a un amigo
                   usando las flechas, el concepto es tuyo para siempre.</li>
             </ol>
             <p class="dim">Y si encuentras errores, pasajes poco claros o tienes ideas para niveles nuevos: escríbeme.
             Este curso está pensado para crecer con quien lo usa.</p>`,
    },
  ],

  quiz: [],

  outro: '',
});
