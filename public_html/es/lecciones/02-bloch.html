<title>2. La esfera de Bloch y la medida — Quantum Arcade</title>
<meta name="description" content="La esfera de Bloch: la latitud como probabilidad, la longitud como fase, qué hace de verdad la medida y cómo medir en bases distintas.">

<body>
<div id="app"></div>
<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { blochLab } from '../../js/widgets/bloch.js';
import { stepper } from '../../js/core/formula.js';

const L = renderLesson({
  id: '02-bloch',
  lead: `Dos flechas complejas son incómodas de dibujar. Por suerte el estado de <b>un</b> cúbit se puede representar
         como <b>un punto sobre una bola</b>: la esfera de Bloch. Es el mapa que usaremos en todo el resto del curso.`,

  steps: [
    {
      t: 'Por qué una esfera',
      html: `<p>Un estado es <code>a|0⟩ + b|1⟩</code> con <code>|a|² + |b|² = 1</code>. Parecen 4 números (dos complejos),
             pero dos ataduras los reducen a <b>solo dos ángulos</b>:</p>
             <ul>
               <li>la normalización (las probabilidades suman 1) quita un grado de libertad;</li>
               <li>la <b>fase global</b> no es observable: multiplicar todo el estado por e^{iα} no cambia ninguna
                   probabilidad de ningún experimento. Así que solo cuenta la <b>diferencia</b> de fase entre a y b.</li>
             </ul>
             <p>Quedan dos ángulos — y dos ángulos es justo lo que hace falta para localizar un punto en una <b>esfera</b>
             (como la latitud y la longitud en un globo terráqueo).</p>
             <div class="formula">|ψ⟩ = cos(<span class="hl-k">θ</span>/2)·|0⟩ + e^{i<span class="hl-x">φ</span>}·sin(<span class="hl-k">θ</span>/2)·|1⟩</div>
             <table class="table">
               <tr><th>En la esfera</th><th>En el estado</th><th>Qué ves al medir</th></tr>
               <tr><td>Polo <b>norte</b></td><td class="mono">|0⟩</td><td>siempre 0</td></tr>
               <tr><td>Polo <b>sur</b></td><td class="mono">|1⟩</td><td>siempre 1</td></tr>
               <tr><td><b>Ecuador</b></td><td class="mono">(|0⟩ ± |1⟩)/√2 etc.</td><td>50% y 50%</td></tr>
               <tr><td>Latitud (θ)</td><td>cuánto |1⟩ hay</td><td>cambia las probabilidades</td></tr>
               <tr><td>Longitud (φ)</td><td>la <b>fase</b></td><td><b>no cambia nada</b>… hasta que aplicas otras puertas</td></tr>
             </table>`,
    },
    {
      t: 'Juega con la esfera',
      html: `<p>Arrastra la bola para girarla. Los botones aplican las puertas (las estudiaremos bien en el nivel siguiente, aquí
             solo sirven para moverse). El botón <b>MEDIR</b> hace lo serio: elige al azar entre 0 y 1 con las
             probabilidades del estado y luego <b>lanza la flecha a un polo</b>.</p>
             <p><b>Experimentos que hacer, por orden:</b></p>
             <ol>
               <li>Pulsa <b>H</b>: la flecha va del polo norte al <b>ecuador</b> (estado |+⟩, 50/50).</li>
               <li>Pulsa <b>S</b> y luego <b>S</b> otra vez: la flecha gira <b>a lo largo</b> del ecuador. Las probabilidades no cambian nunca:
                   estás moviendo <b>solo la fase</b>.</li>
               <li>Pulsa <b>H</b> de nuevo: vuelves a un polo. Las fases deciden <b>a cuál</b>.</li>
               <li>Pulsa <b>MEDIR</b> con la flecha en el ecuador: sale 0 o 1 al azar, y la flecha <b>salta</b> a un polo.
                   Desde ahí, medir otra vez da siempre el mismo resultado: la superposición se ha perdido para siempre.</li>
             </ol>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'equatore', title: 'Vuelta al ecuador', text: 'lleva el cúbit al ecuador (H) y luego haz al menos dos rotaciones de fase (S o P) sin cambiar las probabilidades.', xp: 40 });
        el.appendChild(m.root);
        let hs = 0, ps = 0;
        blochLab(el, {
          onChange: (s, hist) => {
            hs = hist.filter(x => x === 'H').length;
            ps = hist.filter(x => x === 'S' || x.startsWith('P(')).length;
            if (hs >= 1 && ps >= 2) m.complete();
          },
        });
      },
    },
    {
      t: 'La medida: qué pasa de verdad',
      html: `<p>Medir no es "leer un valor que ya estaba ahí". Es una operación que:</p>
             <ol>
               <li>elige un resultado <b>al azar</b>, con probabilidades |a|² y |b|²;</li>
               <li><b>reescribe</b> el estado: después, el cúbit está exactamente en el estado correspondiente al resultado obtenido;</li>
               <li>es <b>irreversible</b>: la información sobre la fase se pierde.</li>
             </ol>
             <div class="callout warn"><b>Cuidado con el malentendido de "hace falta un observador humano".</b> No. "Medida" aquí significa
             <b>cualquier interacción</b> con un sistema lo bastante grande como para registrar el resultado: un detector, una molécula
             de aire, un fotón que rebota. Hasta 20 gramos de agua contienen algo así como 10²⁴ partículas: contra algo
             así, la superposición no sobrevive. Este fenómeno tiene nombre — <b>decoherencia</b> — y volvemos a él en el nivel 21.</div>`,
      mount: el => {
        stepper(el, [
          { h: 'Situación', html: 'Cúbit en el estado <code>0,6|0⟩ + 0,8|1⟩</code>. ¿Qué probabilidad tengo de leer 1?' },
          { h: 'La cuenta', html: '|0,8|² = <b>0,64</b> → 64%. Y de leer 0: |0,6|² = 0,36 → 36%. Suma: 100% ✓' },
          { h: 'Mido y obtengo 1', html: 'Desde este instante el estado es <b>exactamente |1⟩</b>. No "0,8 de |1⟩": justo |1⟩.' },
          { h: 'Mido otra vez', html: 'Obtengo <b>1 con certeza</b>. Y otra vez 1. Para siempre, hasta que aplique otras puertas. El colapso es definitivo.' },
          { h: 'La pregunta mala', html: '¿Puedo reconstruir el estado original (0,6 y 0,8) a partir de una sola medida? <b>No.</b> Necesito preparar el mismo estado muchas veces y medirlo muchas veces. Por eso los experimentos cuánticos se hacen con miles de repeticiones.' },
        ], { doneLabel: '¡Claro!' });
      },
    },
    {
      t: 'Bases distintas: medir "de lado"',
      html: `<p>Hasta ahora hemos medido siempre a lo largo del eje norte-sur (la base <b>Z</b>, es decir "0 o 1").
             Pero también se puede medir a lo largo del eje del ecuador (base <b>X</b>, es decir "|+⟩ o |−⟩"):
             es exactamente lo que hacías al girar el <b>filtro polaroid</b> del nivel 1.</p>
             <ul>
               <li>Un estado <b>|0⟩</b> medido en base Z da 0 con certeza; medido en base X da 50/50.</li>
               <li>Un estado <b>|+⟩</b> medido en base X da + con certeza; medido en base Z da 50/50.</li>
             </ul>
             <div class="callout key"><b>No existe un estado que sea cierto en todas las bases.</b> Es el principio de
             indeterminación, versión cúbit: cuanto más "definido" estás a lo largo de un eje, más indeterminado estás a lo largo de los
             perpendiculares. En la esfera es evidente: la flecha no puede apuntar al norte <i>y</i> al este a la vez.</div>
             <p class="dim small">Truco práctico que usaremos en los algoritmos: para medir en base X basta con aplicar una
             <b>H</b> y luego medir normalmente. La H "gira" la esfera llevando el ecuador a los polos.</p>`,
    },
    {
      t: '💡 Pruébalo tú',
      html: `<div class="callout think">
        <p><b>1.</b> Parte de |0⟩, aplica H, luego Z, luego H. ¿Dónde acabas? Intenta predecirlo y luego compruébalo.
           <span class="muted">(respuesta: |1⟩ — ¡es decir H·Z·H = X!)</span></p>
        <p><b>2.</b> ¿Existe una secuencia de puertas que lleve |0⟩ al eje Y (el estado |i⟩)? <span class="muted">(sí: H y luego S)</span></p>
        <p><b>3.</b> Después de medir, prueba a aplicar H otra vez: la flecha vuelve al ecuador, pero <b>la información de antes
           se ha perdido</b>. ¿En qué sentido "perdida", si el estado vuelve a estar en superposición?</p>
        <p class="mb0"><b>4.</b> Si la fase global no es observable, ¿por qué sí lo es la fase <b>relativa</b>?
           <span class="muted">(pista: mira qué pasa si multiplicas por −1 solo la parte con |1⟩ y luego aplicas H)</span></p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'En la esfera de Bloch, el ecuador corresponde a estados que…',
      options: ['dan siempre 0', 'dan siempre 1', 'dan 50% y 50%', 'están entrelazados'], correct: 2,
      why: 'En el ecuador las dos amplitudes tienen la misma longitud: solo cambia la fase, es decir la longitud geográfica.' },
    { q: '¿Qué efecto tiene una puerta de fase (S, T, P) en la esfera?',
      options: ['mueve la flecha hacia el polo', 'hace girar la flecha por un paralelo, sin cambiar las probabilidades', 'mide el cúbit', 'no hace nada'], correct: 1,
      why: 'Cambia la longitud (la fase), no la latitud: las probabilidades de medida quedan idénticas… hasta que intervienen otras puertas como H.' },
    { q: 'Tras medir un cúbit y obtener 1, al medirlo otra vez se obtiene…',
      options: ['0 o 1 al azar', 'siempre 1', 'siempre 0', 'un error'], correct: 1,
      why: 'La medida ha hecho colapsar el estado en |1⟩: a partir de ahí el resultado es cierto, hasta que se apliquen otras puertas.' },
    { q: 'La fase global (multiplicar todo el estado por e^{iα})…',
      options: ['cambia las probabilidades', 'no es observable', 'crea entrelazamiento', 'invierte el cúbit'], correct: 1,
      why: 'Ningún experimento puede revelarla: por eso la esfera de Bloch, que la ignora, basta para describir por completo un cúbit. La fase <b>relativa</b> entre |0⟩ y |1⟩ sí es de lo más observable.' },
  ],

  outro: `<div class="callout ok"><b>Lo que te llevas a casa:</b> un cúbit = un punto en una esfera; latitud = probabilidad,
          longitud = fase; medir = hacer saltar la flecha a un polo, de forma aleatoria e irreversible.
          Ahora veamos, una a una, las <b>puertas</b> que mueven esta flecha.</div>`,
});
</script>
</body>
