<div id="app"></div>
<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { stepper } from '../../js/core/formula.js';
import { shorLab } from '../../js/widgets/qft.js';

const L = renderLesson({
  id: '20-shor',
  lead: `The final boss of the theory. Shor (1994) is the algorithm that turned quantum computing into an affair of state:
         it factorises huge numbers in polynomial time, and with them it sends RSA cryptography into retirement.
         The nice thing is that <b>almost all of it is classical mathematics</b>: there is only one quantum part, and you already know it.`,

  steps: [
    {
      t: 'Why factorising is hard (and why we care)',
      html: `<p>Multiplying is easy: 3 × 5 = 15, a child can do it. The other way round — given 15, find 3 and 5 — is easy
             only because the number is tiny. With a 600-digit number, the best known classical algorithm
             would take <b>longer than the age of the universe</b>.</p>
             <p>On this asymmetry rests <b>RSA</b>, that is, a good part of the security of the internet:
             the public key is a huge number, the private key is its factors.</p>
             <div class="callout warn"><b>Why is it talked about today, if quantum computers are still small?</b>
             Because of the <b>"harvest now, decrypt later"</b> attack: whoever intercepts encrypted traffic today can store it
             and decrypt it in ten or twenty years. For data that has to stay secret for a long time (health, military,
             industrial) the threat is <b>already here</b>. That is why NIST standardised
             <b>post-quantum</b> algorithms in 2024.</div>`,
    },
    {
      t: 'The brilliant move: from factors to period',
      html: `<p>Shor does not attack factorisation head on. It <b>turns it</b> into another problem:</p>
             <div class="callout key">To factorise N, find the <b>period r</b> of the function
             <code>f(x) = a^x mod N</code>, where a is a randomly chosen number.</div>
             <p>"mod N" means "take the remainder of the division by N". Let us do an example with a = 7 and N = 15:</p>
             <pre><code>x:      0   1   2   3   4   5   6   7   8 …
7^x:    1   7  49 343 2401 …
mod 15: 1   7   4  13   1   7   4  13   1 …
        └──── repeats every 4 ────┘        →  r = 4</code></pre>
             <p>The number 1 comes back after <b>4</b> steps: the period is r = 4. And from here the factors are obtained with two computations
             that were already being done in the nineteenth century.</p>`,
      mount: el => {
        stepper(el, [
          { h: 'Step 1', html: 'We have r = 4, which is <b>even</b> (it needs to be).' },
          { h: 'Step 2', html: 'We compute <code>a^(r/2) mod N</code> = 7² mod 15 = 49 mod 15 = <b>4</b>.' },
          { h: 'Step 3', html: 'Why it works: we know that a^r ≡ 1, so (a^(r/2))² − 1 ≡ 0, that is<br><code>(a^(r/2) − 1)(a^(r/2) + 1) ≡ 0 mod N</code>.<br>The product is a multiple of N, so the two factors "share out" the factors of N.' },
          { h: 'Step 4', html: 'It is enough to compute the greatest common divisors:<br><code>GCD(4 − 1, 15) = GCD(3, 15) = <b>3</b></code><br><code>GCD(4 + 1, 15) = GCD(5, 15) = <b>5</b></code>' },
          { h: 'Done', html: '<b>15 = 3 × 5.</b> And the GCD is computed in a flash with Euclid\'s algorithm (about 300 BC!).' },
          { h: 'When it does not work', html: 'If r is <b>odd</b>, or if a^(r/2) ≡ −1 mod N, the attempt is wasted: you choose another a and start again. It happens in less than half the cases, so a few attempts are enough.' },
        ], { doneLabel: 'Classical mathematics clear!' });
      },
    },
    {
      t: 'And where does the quantum computer come in?',
      html: `<p>In one single place: <b>finding the period r</b>. Classically you would have to compute a^x mod N for one x after the other
             until it comes back to 1 — and for large numbers that is exponentially many attempts.</p>
             <p>Quantum-mechanically it goes like this:</p>
             <ol>
               <li>The first register is put into a <b>uniform superposition</b> over all the x (Hadamard: level 3).</li>
               <li><b>a^x mod N</b> is computed in superposition, writing the result into a second register.
                   Now the two registers are <b>entangled</b> (level 4).</li>
               <li>The <b>second register is measured</b>. A random value comes out — and we do not care which one!
                   The important effect is another: the first register <b>collapses</b> onto all and only the x that give
                   that result, that is, onto a <b>comb</b> with step r.</li>
               <li>The <b>QFT</b> is applied to the first register: the comb becomes <b>peaks</b> on the multiples of M/r (level 18).</li>
               <li>You <b>measure</b>: out comes a number y close to a multiple of M/r.</li>
               <li>You go back to the classical world: from the <b>continued fractions</b> of y/M you obtain r.</li>
             </ol>
             <div class="callout key"><b>The point almost everybody gets wrong:</b> the measurement of step 3 looks like it destroys everything.
             It does not, and it is the gift you saw at level 18: <b>the offset of the comb does not move the peaks</b>.
             Whatever comes out of the second register, the information about the period stays intact.</div>`,
    },
    {
      t: 'Factorise with your own hands',
      html: `<p>Choose N, choose a, look at the table of remainders (the green cells are the points where it comes back to 1),
             then press "measure" and follow the steps. If it goes badly, measure again: it is part of the game.</p>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'shor', title: 'Break RSA (in miniature)', text: 'find the factors of a number by completing all the steps.', xp: 90 });
        el.appendChild(m.root);
        shorLab(el, { onWin: () => m.complete() });
      },
      after: `<div class="callout"><b>About continued fractions:</b> the measurement does not give y exactly equal to a multiple of M/r,
              but a nearby number. Continued fractions are a classical method for finding the <b>simplest</b> fraction
              near a given number: from y/M ≈ k/r you read off the denominator r. It is the same method by which one discovers that
              π ≈ 22/7.</div>`,
    },
    {
      t: 'What it really costs (and why RSA is not broken yet)',
      html: `<table class="table">
               <tr><th></th><th>Classical (best known)</th><th>Shor</th></tr>
               <tr><td>Time to factorise a number of b bits</td><td>about e^(b^{1/3}) — <b>exponential</b></td><td>about b³ — <b>polynomial</b></td></tr>
               <tr><td>RSA-2048</td><td>longer than the age of the universe</td><td>hours… <b>on a computer that does not exist yet</b></td></tr>
             </table>
             <p>The most quoted estimates speak of a few <b>million</b> physical qubits (in order to obtain a few thousand
             error-corrected "logical" qubits) to attack RSA-2048. Today the best processors have a few hundred
             noisy physical qubits. The distance is enormous — but the gap is an engineering one, not a theoretical one,
             and it shrinks year after year.</p>
             <div class="callout ok"><b>The real world's reaction:</b> in August 2024 NIST published the first
             <b>post-quantum</b> cryptography standards (ML-KEM, ML-DSA, SLH-DSA), based on mathematical problems
             that neither Shor nor Grover know how to attack. The migration has already begun: modern browsers and messaging apps
             already use hybrid post-quantum key exchanges.</div>`,
    },
    {
      t: '💡 Try it yourself',
      html: `<div class="callout think">
        <p><b>1.</b> With N = 15, try <b>all</b> the valid a (2, 4, 7, 8, 11, 13, 14): which ones have an odd period
           and therefore do not work?</p>
        <p><b>2.</b> Why is a = 1 of no use at all? And why must a have GCD(a, N) = 1?
           <span class="muted">(if it did not, you would have already found a factor without bothering with quantum mechanics!)</span></p>
        <p><b>3.</b> With N = 21, which a gives the shortest period? Does a short period make the algorithm easier or harder?</p>
        <p class="mb0"><b>4.</b> As an inventor: Shor works because the function a^x mod N has a <b>hidden periodic structure</b>.
           Which other famous problem has a hidden structure that the QFT could bring out?
           <i>(Hint: the discrete logarithm — indeed Shor breaks that too, and with it elliptic-curve cryptography.)</i></p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'To which problem does Shor reduce factorisation?',
      options: ['finding the period of a^x mod N', 'sorting a list', 'searching a database', 'adding up prime numbers'], correct: 0,
      why: 'Once the (even) period r is found, the factors are obtained with GCD(a^{r/2} ∓ 1, N): elementary classical mathematics.' },
    { q: 'Why does measuring the second register not ruin the algorithm?',
      options: ['because it is not really measured', 'because the offset of the comb does not move the peaks of the QFT', 'because the result is always 1', 'because the registers are not entangled'], correct: 1,
      why: 'It collapses onto a comb with a random offset, but the probabilities after the QFT depend only on the period, not on the offset.' },
    { q: 'What are continued fractions for in Shor?',
      options: ['preparing the initial state', 'obtaining the period r from the measured number y/M', 'reducing the noise', 'computing the GCD'], correct: 1,
      why: 'They approximate y/M with the simplest fraction k/r: the denominator is the period we are looking for.' },
    { q: 'Why has RSA-2048 not been broken by Shor yet?',
      options: ['because the algorithm is wrong', 'because millions of error-corrected physical qubits are needed', 'because RSA is immune', 'because it is forbidden'], correct: 1,
      why: 'It is an engineering problem (noise, error correction, scale), not a theoretical one. That is why the NIST post-quantum standards of 2024 already exist.' },
    { q: 'What is the right countermeasure against Shor?',
      options: ['longer RSA keys', 'moving to post-quantum algorithms (lattice-based, hash-based…)', 'using AES-128', 'switching off the internet'], correct: 1,
      why: 'Making RSA keys longer is not enough: Shor scales polynomially. You have to change the underlying mathematical problem.' },
  ],

  outro: `<div class="callout ok"><b>BOSS DEFEATED.</b> You have seen the most famous algorithm in the history of quantum computing
          and — more importantly — you know <b>why</b> it works: periodicity → comb → QFT → peaks → continued fractions → factors.
          Three things are left: why you do not have it in your pocket yet (noise), inventing something of your own (workshop) and the exam.</div>`,
});
</script>
</body>
