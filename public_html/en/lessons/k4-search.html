<title>K·4 · Searching — Quantum Arcade</title>
<meta name="description" content="Linear search and binary search played by counting comparisons: why an unsorted list cannot be beaten below N/2 tries, and why that is exactly the record Grover breaks.">
<link rel="canonical" href="https://quantumarcade.it/en/lessons/k4-search.html">
<link rel="alternate" hreflang="it" href="https://quantumarcade.it/lezioni/k4-ricerca.html">

<body>
<div id="app"></div>
<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { confronto } from '../../js/core/confronto.js';
import { searchRace } from '../../js/widgets/classic2.js';

const L = renderLesson({
  id: 'k4-ricerca',
  lead: `"Searching" sounds like one thing and it is two, and the difference between them is everything.
         Searching a <b>sorted</b> shelf is easy and extremely fast. Searching an <b>unsorted</b> shelf is
         tedious and no cleverness helps. Play both while counting your tries on your fingers: that number is
         the yardstick we will use to measure Grover at level 11.`,

  steps: [
    {
      t: 'Two shelves, two worlds',
      html: `<p>In the game the boxes hide numbers and you are looking for one of them.</p>
             <ul>
               <li><b>Unsorted shelf:</b> an opened box only tells you what is <b>in that one</b>. No hint about
                   where to look next. Try it, count, and you will see you end up opening about <b>half</b> of
                   them before you find it — sometimes sooner by luck, sometimes nearly all of them.</li>
               <li><b>Sorted shelf:</b> every opened box also tells you <b>which way</b> to go on. Open the middle
                   one and you throw away half the shelf. Then half again. Then half again.</li>
             </ul>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'ricerca', title: 'The two hunts', text: 'find the number on the unsorted shelf, then on the sorted one using at most 5 openings.', xp: 40 });
        el.appendChild(m.root);
        searchRace(el, { n: 16, onWin: () => m.complete() });
      },
      after: `<div class="callout key"><b>The count for the two strategies</b>, on N boxes:
              <br>· <b>linear</b> (unsorted): <b>N/2</b> openings on average, N in the worst case.
              <br>· <b>binary</b> (sorted): <b>log₂N</b> openings, always, even in the worst case.
              <br>On a million boxes: 500,000 against <b>20</b>. That is not a difference in computer speed:
              it is a difference in <b>method</b>, and it holds on any machine.</div>`,
    },
    {
      t: 'Why you cannot do better in the disorder',
      html: `<p>This is one of the few things in computer science that are actually <b>proved</b>, and the proof
             fits in three lines you can follow without any maths:</p>
             <div class="callout">
               <p>Imagine being the adversary, allowed to decide the contents of the boxes <b>while</b> the other
               person searches. Every time they open a box, you put a wrong number in it — you can, as long as
               at least one box is still closed.</p>
               <p class="mb0">As long as one box is closed, the searcher <b>cannot be sure</b>. So in the worst
               case they must open all of them. There is no clever algorithm: the information they need is not
               in the shelf, it is spread over N places and must be collected one place at a time.</p>
             </div>
             <p>This kind of argument is called a <b>lower bound</b>: it does not say "we have not managed yet",
             it says "nobody ever will". Which is why Grover's result made noise: it looked like a violation.</p>
             <div class="callout warn"><b>It does not violate it.</b> The bound holds for a computer that opens
             <b>one box at a time</b>. Grover opens boxes in a way that classically does not exist: it queries
             them all together and then makes the wrong answers <b>cancel each other out</b>. And indeed there
             is a second theorem saying that not even a quantum computer can do better than √N: the bound is
             there too, just lower down.</div>`,
      after: confronto({
        titolo: 'Needle in a haystack: the three ways',
        livello: '11-grover',
        vaiA: 'Go to Grover (level 11)',
        classico: {
          titolo: 'With a normal computer',
          html: `<p><b>Sorted</b> shelf: halve every time → <b>log₂N</b> tries. Unbeatable, and no quantum computer
                 does better.</p>
                 <p class="mb0"><b>Unsorted</b> shelf: no shortcut → <b>N/2</b> tries on average. Proved that you
                 cannot do better.</p>`,
        },
        quantistico: {
          titolo: 'With Grover',
          html: `<p>On the <b>unsorted</b> shelf: about <b>√N</b> tries. On a million boxes, a thousand instead of
                 half a million.</p>
                 <p class="mb0">On the <b>sorted</b> shelf it is useless: log₂N already beats √N. The quantum
                 advantage only exists where the classical machine <b>has no structure to exploit</b>.</p>`,
        },
        numeri: [
          { cosa: 'N = 100', classico: '50 tries', quantistico: '10 tries' },
          { cosa: 'N = 1,000,000', classico: '500,000', quantistico: '~785' },
          { cosa: 'sorted list, N = 1,000,000', classico: '20', quantistico: '20 (no gain)' },
        ],
        verdetto: `<b>Grover's gain is quadratic, not magic:</b> it halves the exponent, it does not knock it down.
                   Which is why doubling the key length is enough against symmetric cryptography, while against
                   RSA (which falls for a different reason, at level 20) nothing is enough.`,
      }),
    },
    {
      t: 'Searching in practice: why nobody really searches',
      html: `<p>If you open your phone's contacts and type three letters, the result appears <b>instantly</b> even
             with ten thousand contacts. That is not linear search, and not binary search either: it is that
             somebody, earlier, built an <b>index</b>.</p>
             <ul>
               <li><b>Sorting costs</b> N·log N, but you pay once and then every search costs log N. It pays off
                   as soon as you search more than once.</li>
               <li><b>Hash tables</b> go further: they turn the data into an address and get there in <b>one
                   shot</b>, on average. That is why databases hardly ever really search.</li>
               <li><b>Where Grover truly matters</b> is where the index <b>cannot be built</b>: when the
                   possibilities are not in an archive but are <i>generated</i> — all possible keys, all possible
                   moves, all possible combinations. There is nothing to sort, because nothing is written
                   anywhere.</li>
             </ul>
             <div class="callout warn"><b>The honest objection:</b> to have Grover search a real archive you would
             first have to <b>load the archive</b> into the quantum computer, and loading N items costs at least
             N. The gain evaporates. That is why Grover is used on problems <b>generated by a rule</b> (a function
             to invert), not on customer lists.</div>`,
    },
    {
      t: '💡 Your turn',
      html: `<div class="callout think">
        <p><b>1.</b> On the sorted shelf of 16 boxes, how many openings do you need <b>at most</b>? Check that 2⁴ = 16 and that the answer is 4 (plus one to confirm).</p>
        <p><b>2.</b> On the unsorted one, play five games and write down the tries: take the average. Do you get close to 8?</p>
        <p><b>3.</b> If the shelf has a million boxes and you open one per second: how long is linear search in the worst case? And binary search?</p>
        <p class="mb0"><b>4.</b> Inventor's question: what if <b>two</b> boxes were right instead of one? Does linear search improve? By how much? <span class="muted">(and keep the answer: it also changes Grover's number of iterations)</span></p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'On an UNSORTED list of N items, how many comparisons does it take on average?',
      options: ['log N', 'N/2', '√N', 'always 1'], correct: 1,
      why: 'Half the list on average, all of it in the worst case. Without structure no better strategy exists, and that is proved.' },
    { q: 'Binary search requires…',
      options: ['a sorted list', 'a short list', 'a fast computer', 'two processors'], correct: 0,
      why: 'It needs the ordering: that is what lets you throw away half the list at every comparison.' },
    { q: 'Why does Grover not help on an already sorted list?',
      options: ['it is too slow', 'because log N is already much better than √N', 'because it does not work on numbers', 'because it needs too much memory'], correct: 1,
      why: 'On a million items: 20 comparisons with binary search against about 785 with Grover. The quantum advantage lives only where structure is missing.' },
    { q: 'What is a "lower bound" in computer science?',
      options: ['the minimum time on a specific computer', 'a proof that no algorithm can do better than that', 'the minimum number of lines of code', 'the minimum memory required'], correct: 1,
      why: 'It does not say "nobody has managed so far": it says "nobody ever will". Grover has one too, and it is √N.' },
  ],

  outro: `<div class="callout ok"><b>What you take home:</b> with structure (order) you search in log N; without
          structure you pay N/2 and there is no way out. Keep these two numbers in mind: level 11 will add a
          third one, √N, and now you will know what it sits between.
          Next level: putting all the costs on a single graph.</div>`,
});
</script>
</body>
