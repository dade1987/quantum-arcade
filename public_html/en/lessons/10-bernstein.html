<title>10. Bernstein–Vazirani: the secret string — Quantum Arcade</title>
<meta name="description" content="Guessing an n-bit secret with a single query: writing a whole string into the phases and reading it back with a Hadamard–Walsh transform.">

<body>
<div id="app"></div>
<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { stepper } from '../../js/core/formula.js';
import { bvLab } from '../../js/widgets/algos.js';

const L = renderLesson({
  id: '10-bernstein',
  lead: `Same pattern as level 9, more concrete problem: there is a <b>secret string</b> and you have to guess it.
         Classically it takes one query per bit. Quantumly: <b>one, always</b>.`,

  steps: [
    {
      t: 'The secret problem',
      html: `<p>There is a secret string <b>s</b> of n bits (say <code>1011</code>). The oracle will not tell you what it is,
             but it answers this question: given an input x, <b>how many bits do s and x have in common</b>… but only
             whether that number is <b>even or odd</b>.</p>
             <div class="formula">f(x) = s · x mod 2 &nbsp;&nbsp;<span class="muted">(sum of the shared bits, kept even/odd)</span></div>
             <p>Example with s = <code>1011</code>:</p>
             <pre><code>x = 0001 →  shared bits: 1     → odd  → f = 1
x = 0110 →  shared bits: 1     → odd  → f = 1
x = 1010 →  shared bits: 2     → even → f = 0</code></pre>
             <p><b>Classical strategy:</b> ask <code>0001</code> and you learn the last bit of s. Then <code>0010</code> and you learn
             the second to last. And so on: <b>n queries</b> for n bits. You cannot do better classically,
             not even with luck: every answer is a single bit of information.</p>`,
    },
    {
      t: 'The quantum solution: one query',
      html: `<p>The three moves are the same as level 9 — <b>H, oracle, H</b> — but the result is far prettier:
             instead of a yes/no, out comes <b>the whole secret string</b>.</p>
             <p>Look at the bars: after the second Hadamard <b>one single</b> bar stands at 100%, and its label <b>is</b> the secret.</p>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'bv', title: 'Steal the secret', text: 'find the secret string with the quantum query.', xp: 55 });
        el.appendChild(m.root);
        bvLab(el, { n: 4, onWin: () => m.complete() });
      },
    },
    {
      t: 'Why exactly s comes out (and not something else)',
      html: `<p>The sum is simpler than it looks, and worth doing because it is <b>the very same sum as the QFT</b>
             in a reduced version.</p>`,
      mount: el => {
        stepper(el, [
          { h: 'After the first H', html: 'All 2^n possibilities with the same amplitude. Call it a "flat grid".' },
          { h: 'After the oracle', html: 'Every possibility x picks up the sign (−1)^(s·x). The result is a <b>chequerboard of signs</b>, and the pattern of that chequerboard depends on <b>nothing but</b> s. In practice: <b>s has been written into the phases</b>.' },
          { h: 'What the second H does', html: 'The Hadamard on n qubits turns every state |y⟩ into a combination with signs (−1)^(x·y). Summing over all x, the amplitude of state |y⟩ becomes proportional to<br><code>Σ_x (−1)^(s·x + x·y)</code>' },
          { h: 'The cancellation', html: 'If <b>y ≠ s</b>, the exponents are half even and half odd: half +1 and half −1 → sum <b>zero</b>. Perfect destructive interference.<br>If <b>y = s</b>, the exponents cancel each other (s·x + x·s is always even) → all +1 → <b>maximum</b> sum.' },
          { h: 'Result', html: 'Amplitude 1 on |s⟩, zero on everything else. You measure once and read <b>s</b>. No repetition, no chance of error.' },
          { h: 'The link with what comes next', html: 'This is already a <b>Fourier transform</b>, in its simplest version (the one on ±1, called the Hadamard–Walsh transform). At level 18 we do the same thing with arrows pointing in <b>every</b> direction instead of just + and −: that will be the QFT.' },
        ], { doneLabel: 'Crystal clear!' });
      },
    },
    {
      t: 'Why this counts for more than Deutsch–Jozsa',
      html: `<p>Deutsch–Jozsa is easily beaten by a <b>probabilistic</b> classical algorithm (a few random queries
             and you are almost certain). Bernstein–Vazirani is not: even accepting a small chance of error,
             classically you need <b>on the order of n</b> queries, because each answer contains a single bit of information.</p>
             <div class="callout key">Bernstein–Vazirani is therefore the first example of a <b>solid</b> quantum advantage:
             n queries against 1, even against the best randomised classical algorithm.
             The jump is "only" linear, but it is real — and the technique (writing a whole string into the phases and reading it with
             a transform) is exactly the one that, applied to <b>periodicities</b>, will lead to Simon and to Shor.</div>
             <p class="dim small">A security note: no, this does not "break passwords". The oracle here is a very special
             mathematical function with a linear structure. The functions used in cryptography are designed
             precisely so as not to have structures of this kind.</p>`,
    },
    {
      t: '💡 Your turn',
      html: `<div class="callout think">
        <p><b>1.</b> In the game, how many classical queries does a 4-bit secret take? And a 64-bit one?</p>
        <p><b>2.</b> If the secret were <code>0000</code>, what would the oracle answer to any query?
           And would the quantum method still work?</p>
        <p><b>3.</b> Try explaining in your own words why every bar but one cancels.</p>
        <p class="mb0"><b>4.</b> An inventor's question: what if the oracle, instead of hiding a string, hid
           a <b>periodicity</b> ("f(x) = f(x + r) for some r")? What would you have to put in place of the final Hadamards?
           <i>(If you answer "a Fourier transform", you have just invented half of Shor's algorithm.)</i></p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'How many queries does it take classically to find a secret string of n bits?',
      options: ['1', 'n', 'log n', '2^n'], correct: 1,
      why: 'Every answer is worth one bit of information: it takes n queries, one per bit. Quantumly one is enough.' },
    { q: 'After the second Hadamard, the Bernstein–Vazirani state is…',
      options: ['a uniform superposition', 'exactly |s⟩ with probability 100%', 'entangled', 'random'], correct: 1,
      why: 'All the other amplitudes cancel through destructive interference: only the secret string is left.' },
    { q: 'What does the oracle do in this algorithm?',
      options: ['it reveals s directly', 'it writes s into the pattern of signs (the phases)', 'it measures the qubits', 'it creates entanglement'], correct: 1,
      why: 'The sign (−1)^(s·x) depends on s: the secret is "drawn" into the phases, invisible to the probabilities but readable by interference.' },
    { q: 'The transform realised by n Hadamards in parallel is called…',
      options: ['the quantum Fourier transform', 'the Hadamard–Walsh transform', 'the Laplace transform', "Grover's diffusion"], correct: 1,
      why: 'It is the "+ and − only" version of the Fourier transform. The QFT (level 18) is the same idea with phases in every direction.' },
  ],

  outro: `<div class="callout ok"><b>What you take home:</b> a <b>whole string</b> can be written into the phases and
          read back with a transform; n queries → 1. Next level: what if instead of a hidden structure
          we had to look for <b>a needle in a haystack with no structure at all</b>?</div>`,
});
</script>
