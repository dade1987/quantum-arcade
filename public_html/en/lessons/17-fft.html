<div id="app"></div>
<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { costLab, butterflyLab } from '../../js/widgets/fftlab.js';

const L = renderLesson({
  id: '17-fft',
  lead: `The DFT of level 16 is correct but slow: for N numbers it does N×N multiplications. The <b>FFT</b> gets
         the exact same result with far fewer operations. Understanding <i>why</i> matters, because the quantum
         QFT uses the same trick — pushed much further.`,

  steps: [
    {
      t: 'The problem: N² grows horribly',
      html: `<p>Read the formula of level 16 again: for <b>every</b> frequency k you have to add up <b>N</b> pieces. And the frequencies
             to be tested are N. Total: <b>N × N</b> operations.</p>
             <table class="table">
               <tr><th>N (samples)</th><th>Direct DFT (N²)</th><th>Indicative time</th></tr>
               <tr><td class="mono">8</td><td class="mono">64</td><td>instant</td></tr>
               <tr><td class="mono">1,024</td><td class="mono">1,048,576</td><td>a few milliseconds</td></tr>
               <tr><td class="mono">1,000,000</td><td class="mono">1,000,000,000,000</td><td>hours</td></tr>
             </table>
             <p>An audio file of a few seconds already has hundreds of thousands of samples: with the direct DFT,
             every analysis would take hours. With the FFT, milliseconds. It is the difference between "impossible" and "your phone does it
             while you sing at karaoke".</p>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'costi', title: 'The count that changes everything', text: 'take the slider to at least 16 qubits and compare the three numbers: DFT, FFT and QFT gates.', xp: 35 });
        el.appendChild(m.root);
        costLab(el, { onWin: () => m.complete() });
      },
    },
    {
      t: 'The trick: even and odd',
      html: `<p>The idea (Cooley and Tukey, 1965 — but already glimpsed by Gauss in 1805!) is this:</p>
             <div class="callout key">A DFT on <b>N</b> points can be obtained from <b>two</b> DFTs on <b>N/2</b> points:
             one on the samples in <b>even</b> positions, one on those in <b>odd</b> positions. Then N final combinations are enough
             to put the results back together.</div>
             <p>Why is it worth it? Because two half-sized problems cost 2 × (N/2)² = N²/2: <b>half already</b>.
             And the same thing can be done again inside each of the two halves. And inside their halves. And so on.</p>
             <p>How many times can N be halved before reaching 1? Exactly <b>log₂N</b> times
             (for N = 1024 that is 10 times). That is where the famous <b>N·log N</b> comes from.</p>`,
      mount: el => butterflyLab(el),
      after: `<div class="callout"><b>The "putting back together" formula:</b>
              <code>X(k) = Even(k) + e^{−i2πk/N} · Odd(k)</code><br>
              That <b>e^{−i2πk/N}</b> is our rotating arrow of level 8 (in the jargon it is called the <i>twiddle factor</i>):
              it rotates the contribution of the odd ones before adding it. Every combination of this kind is called a
              <b>butterfly</b>, because of the way the diagram is drawn.</div>`,
    },
    {
      t: 'And the QFT? Same trick, but on amplitudes',
      html: `<p>Now the comparison that will take us straight into the quantum part. Look at the three numbers in the game above
             for N = 2^20 (about a million):</p>
             <table class="table">
               <tr><th>Method</th><th>Operations</th><th>What you get</th></tr>
               <tr><td>Direct DFT</td><td class="mono">~10¹²</td><td>all the results, readable</td></tr>
               <tr><td>FFT</td><td class="mono">~10⁷</td><td>all the results, readable</td></tr>
               <tr><td><b>QFT</b> (quantum)</td><td class="mono">~210 gates</td><td><b>a single result</b> when you measure</td></tr>
             </table>
             <div class="callout warn"><b>Do not fall for it:</b> the QFT is not "an FFT 50,000 times faster".
             The QFT transforms a million amplitudes with two hundred gates, but <b>you cannot read those amplitudes</b>:
             the measurement gives you back only one of them, chosen at random according to the probabilities.
             <br><br>The QFT is useful when you care about a <b>global property</b> — typically a <b>periodicity</b> —
             which, after the transform, becomes the <b>most probable</b> result. It is not for printing the spectrum of an MP3.</div>
             <p>This distinction is what separates those who have understood quantum computing from those who repeat slogans.
             Hold on to it: we will hammer it again at level 18.</p>`,
    },
    {
      t: '💡 Try it yourself',
      html: `<div class="callout think">
        <p><b>1.</b> In the cost game, find the value of n beyond which the direct DFT goes over a billion operations.</p>
        <p><b>2.</b> The classical FFT requires N to be a power of 2. Why, in your opinion? <span class="muted">(hint: halving)</span></p>
        <p><b>3.</b> With 30 qubits you would have over a billion amplitudes and the QFT would use about 465 gates.
           If you could read them all, you would have beaten the FFT by an enormous factor. Why is the "if" impossible?</p>
        <p class="mb0"><b>4.</b> A question to keep open until level 18: what <b>question</b> could you ask a million
           amplitudes, such that the answer is <b>a single number</b>?</p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'What is the typical cost of the FFT on N points?',
      options: ['N', 'N log N', 'N²', '2^N'], correct: 1,
      why: 'log₂N levels of halving, N operations per level. For N = 1024: about 5,120 butterflies against 1,048,576 multiplications.' },
    { q: 'What is the FFT trick based on?',
      options: ['it approximates the result', 'it divides the problem into even and odd samples', 'it uses real numbers instead of complex ones', 'it ignores the high frequencies'], correct: 1,
      why: 'It is divide and conquer, and the result is <b>exact</b>, not approximate: identical to that of the direct DFT.' },
    { q: 'Why does the QFT not replace the FFT for analysing an audio file?',
      options: ['because it is less accurate', 'because measuring gives a single result, not the whole list', 'because it is slower', 'because it is only useful for prime numbers'], correct: 1,
      why: 'It transforms all the amplitudes with very few gates, but reading them all is impossible: the measurement returns just one. It is for making things interfere, not for printing.' },
  ],

  outro: `<div class="callout ok"><b>Part C completed!</b> You have waves, phase, sum of waves, DFT and FFT: the tool is ready.
          In Part D we mount it inside a quantum circuit and the <b>QFT</b> is born.</div>`,
});
</script>
