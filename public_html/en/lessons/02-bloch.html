<title>2 · The Bloch sphere — Quantum Arcade</title>
<meta name="description" content="The Bloch sphere: latitude as probability, longitude as phase, what measurement really does, and measuring in different bases.">

<body>
<div id="app"></div>
<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { blochLab } from '../../js/widgets/bloch.js';
import { stepper } from '../../js/core/formula.js';

const L = renderLesson({
  id: '02-bloch',
  lead: `Two complex arrows are awkward to draw. Luckily the state of <b>one</b> qubit can be represented
         as <b>a point on a ball</b>: the Bloch sphere. It is the map we will use for the rest of the course.`,

  steps: [
    {
      t: 'Why a sphere',
      html: `<p>A state is <code>a|0⟩ + b|1⟩</code> with <code>|a|² + |b|² = 1</code>. That looks like 4 numbers (two complex ones),
             but two constraints cut them down to <b>just two angles</b>:</p>
             <ul>
               <li>normalisation (probabilities add to 1) removes one degree of freedom;</li>
               <li>the <b>global phase</b> is not observable: multiplying the whole state by e^{iα} changes no
                   probability in any experiment. So only the <b>difference</b> in phase between a and b counts.</li>
             </ul>
             <p>Two angles are left — and two angles is exactly what it takes to pin down a point on a <b>sphere</b>
             (like latitude and longitude on a globe).</p>
             <div class="formula">|ψ⟩ = cos(<span class="hl-k">θ</span>/2)·|0⟩ + e^{i<span class="hl-x">φ</span>}·sin(<span class="hl-k">θ</span>/2)·|1⟩</div>
             <table class="table">
               <tr><th>On the sphere</th><th>In the state</th><th>What you see when measuring</th></tr>
               <tr><td><b>North</b> pole</td><td class="mono">|0⟩</td><td>always 0</td></tr>
               <tr><td><b>South</b> pole</td><td class="mono">|1⟩</td><td>always 1</td></tr>
               <tr><td><b>Equator</b></td><td class="mono">(|0⟩ ± |1⟩)/√2 etc.</td><td>50% and 50%</td></tr>
               <tr><td>Latitude (θ)</td><td>how much |1⟩ there is</td><td>changes the probabilities</td></tr>
               <tr><td>Longitude (φ)</td><td>the <b>phase</b></td><td><b>changes nothing</b>… until you apply further gates</td></tr>
             </table>`,
    },
    {
      t: 'Play with the sphere',
      html: `<p>Drag the ball to turn it. The buttons apply gates (we study them properly next level, here they are
             just for getting around). The <b>MEASURE</b> button does the serious thing: it picks at random between 0 and 1 with the
             state's probabilities and then <b>throws the arrow onto a pole</b>.</p>
             <p><b>Experiments to run, in order:</b></p>
             <ol>
               <li>Press <b>H</b>: the arrow goes from the north pole to the <b>equator</b> (state |+⟩, 50/50).</li>
               <li>Press <b>S</b> and then <b>S</b> again: the arrow turns <b>along</b> the equator. The probabilities never change:
                   you are moving <b>only the phase</b>.</li>
               <li>Press <b>H</b> again: you come back to a pole. The phases decide <b>which</b> one.</li>
               <li>Press <b>MEASURE</b> with the arrow on the equator: 0 or 1 comes out at random, and the arrow <b>jumps</b> to a pole.
                   From there, measuring again always gives the same result: the superposition is gone for good.</li>
             </ol>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'equatore', title: 'A lap of the equator', text: 'take the qubit to the equator (H) and then make at least two phase rotations (S or P) without changing the probabilities.', xp: 40 });
        el.appendChild(m.root);
        let hs = 0, ps = 0;
        blochLab(el, {
          onChange: (s, hist) => {
            hs = hist.filter(x => x === 'H').length;
            ps = hist.filter(x => x === 'S' || x.startsWith('P(')).length;
            if (hs >= 1 && ps >= 2) m.complete();
          },
        });
      },
    },
    {
      t: 'Measurement: what actually happens',
      html: `<p>Measuring is not "reading a value that was already there". It is an operation that:</p>
             <ol>
               <li>picks a result <b>at random</b>, with probabilities |a|² and |b|²;</li>
               <li><b>rewrites</b> the state: afterwards the qubit is exactly in the state matching the result obtained;</li>
               <li>is <b>irreversible</b>: the phase information is lost.</li>
             </ol>
             <div class="callout warn"><b>Beware the "you need a human observer" misunderstanding.</b> No. "Measurement" here means
             <b>any interaction</b> with a system big enough to record the outcome: a detector, a molecule
             of air, a bouncing photon. Even 20 grams of water contain something like 10²⁴ particles: against something
             like that, superposition does not survive. This phenomenon has a name — <b>decoherence</b> — and we come back to it at level 21.</div>`,
      mount: el => {
        stepper(el, [
          { h: 'Setup', html: 'Qubit in the state <code>0.6|0⟩ + 0.8|1⟩</code>. What is my probability of reading 1?' },
          { h: 'The sum', html: '|0.8|² = <b>0.64</b> → 64%. And of reading 0: |0.6|² = 0.36 → 36%. Total: 100% ✓' },
          { h: 'I measure and get 1', html: 'From this instant the state is <b>exactly |1⟩</b>. Not "0.8 of |1⟩": plain |1⟩.' },
          { h: 'I measure again', html: 'I get <b>1 with certainty</b>. And 1 again. Forever, until I apply other gates. The collapse is final.' },
          { h: 'The nasty question', html: 'Can I reconstruct the original state (0.6 and 0.8) from one single measurement? <b>No.</b> I have to prepare the same state many times and measure it many times. That is why quantum experiments are run over thousands of repetitions.' },
        ], { doneLabel: 'Clear!' });
      },
    },
    {
      t: 'Different bases: measuring "sideways"',
      html: `<p>So far we have always measured along the north–south axis (the <b>Z</b> basis, that is "0 or 1").
             But you can also measure along the equator's axis (the <b>X</b> basis, that is "|+⟩ or |−⟩"):
             which is exactly what you were doing when you rotated the <b>polaroid filter</b> in level 1.</p>
             <ul>
               <li>A state <b>|0⟩</b> measured in the Z basis gives 0 with certainty; measured in the X basis it gives 50/50.</li>
               <li>A state <b>|+⟩</b> measured in the X basis gives + with certainty; measured in the Z basis it gives 50/50.</li>
             </ul>
             <div class="callout key"><b>There is no state that is certain in every basis.</b> That is the uncertainty
             principle, qubit edition: the more "definite" you are along one axis, the more undetermined you are along the
             perpendicular ones. On the sphere it is obvious: the arrow cannot point north <i>and</i> east at the same time.</div>
             <p class="dim small">A practical trick we will use in the algorithms: to measure in the X basis you just apply an
             <b>H</b> and then measure normally. H "rotates" the sphere, bringing the equator to the poles.</p>`,
    },
    {
      t: '💡 Your turn',
      html: `<div class="callout think">
        <p><b>1.</b> Start from |0⟩, apply H, then Z, then H. Where do you end up? Try predicting it, then check.
           <span class="muted">(answer: |1⟩ — that is, H·Z·H = X!)</span></p>
        <p><b>2.</b> Is there a sequence of gates taking |0⟩ onto the Y axis (the state |i⟩)? <span class="muted">(yes: H then S)</span></p>
        <p><b>3.</b> After measuring, try applying H again: the arrow goes back to the equator, but <b>the earlier information
           is lost</b>. In what sense "lost", if the state is in superposition again?</p>
        <p class="mb0"><b>4.</b> If the global phase is not observable, why is the <b>relative</b> phase?
           <span class="muted">(hint: look at what happens if you multiply only the |1⟩ piece by −1 and then apply H)</span></p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'On the Bloch sphere, the equator corresponds to states that…',
      options: ['always give 0', 'always give 1', 'give 50% and 50%', 'are entangled'], correct: 2,
      why: 'On the equator the two amplitudes have the same length: only the phase changes, that is, the longitude.' },
    { q: 'What effect does a phase gate (S, T, P) have on the sphere?',
      options: ['it moves the arrow towards a pole', 'it turns the arrow along a parallel, without changing the probabilities', 'it measures the qubit', 'it does nothing'], correct: 1,
      why: 'It changes the longitude (the phase), not the latitude: the measurement probabilities stay identical… until other gates like H come along.' },
    { q: 'After measuring a qubit and getting 1, measuring it again gives…',
      options: ['0 or 1 at random', 'always 1', 'always 0', 'an error'], correct: 1,
      why: 'The measurement collapsed the state onto |1⟩: from then on the result is certain, until other gates are applied.' },
    { q: 'The global phase (multiplying the whole state by e^{iα})…',
      options: ['changes the probabilities', 'is not observable', 'creates entanglement', 'flips the qubit'], correct: 1,
      why: 'No experiment can reveal it: that is why the Bloch sphere, which ignores it, is enough to describe a qubit completely. The <b>relative</b> phase between |0⟩ and |1⟩ is, by contrast, very much observable.' },
  ],

  outro: `<div class="callout ok"><b>What you take home:</b> a qubit = a point on a sphere; latitude = probability,
          longitude = phase; measuring = making the arrow jump to a pole, randomly and irreversibly.
          Now let us look, one by one, at the <b>gates</b> that move this arrow.</div>`,
});
</script>
</body>
</html>
