    {

   └─ probability = square (0·1) ──────────────────┐

probability and frequencies (0·4)                  │

QUBIT = two amplitudes (1) ── measure → |amplitude|² ┘

   ├─ two qubits → 4 amplitudes → ENTANGLEMENT (4)

INTERFERENCE: the amplitudes add up, then you take the square (7)

                    │

   ├─ QPE: reading a phase as a number (${nOf('19-qpe')})
   └─ SHOR: period → peaks → continued fractions → factors (${nOf('20-shor')})
                    │
noise and error correction (${nOf('21-rumore')}) · creative workshop (${nOf('22-officina')}) · exam (${nOf('24-esame')})</code></pre>
             <div class="callout key"><b>If I had to sum up the whole course in one sentence:</b>

               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "It tries all the solutions in parallel"</h3>
                 <p class="mb0 dim">It explores them all, but <b>it can read only one</b>. The advantage comes from the interference

               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "A qubit is 0 and 1 at the same time"</h3>

               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "The amplitude is the probability"</h3>

               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "Quantum computers will replace ours"</h3>
