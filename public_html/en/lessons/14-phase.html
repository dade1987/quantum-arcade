<title>2 · The phase — Quantum Arcade</title>
<meta name="description" content="The phase of a wave: phase shift, time delay and interference between two waves, with an interactive simulator.">

<body>
<div id="app"></div>
<script type="module">
import { renderLesson } from '../../js/core/lesson.js';
import { formula, stepper } from '../../js/core/formula.js';
import { waveLab } from '../../js/widgets/wave.js';
import { twoWaves } from '../../js/widgets/twowaves.js';

const L = renderLesson({
  id: '14-fase',
  lead: `You have already met the phase twice: as <b>longitude</b> on the Bloch sphere (level 2) and as
         <b>direction of the arrow</b> (level 8). Here we see it in its third form: the <b>shift of a wave</b>.
         It is always the same thing — and it is about to become the heart of the Fourier transform.`,

  steps: [
    {
      t: 'What phase is, in the plainest words',
      html: `
        <p>Picture two friends on swings. They go at the same speed and reach the same height:
        same <b>frequency</b>, same <b>amplitude</b>. But one is <b>ahead</b> of the other: while one goes up, the other comes down.</p>
        <p>That difference is called <b>phase</b>. Phase answers one single question:</p>
        <div class="callout key"><b>"Where in the turn are you?"</b><br>
        Not "how high are you" (that is the amplitude), not "how fast do you go" (that is the frequency).
        Just: <b>at which point of the cycle</b>.</div>
        <p>Since one cycle is one full turn, the phase is measured in <b>degrees</b> (0° … 360°) or in <b>radians</b>
        (0 … 2π, where 2π = one turn). They are two units of measurement for the same thing, like kilometres and miles.</p>
        <table class="table">
          <tr><th>Phase</th><th>In radians</th><th>Where you are in the turn</th><th>What effect it has</th></tr>
          <tr><td class="mono">0°</td><td class="mono">0</td><td>at the starting point (at the top)</td><td>"normal" wave</td></tr>
          <tr><td class="mono">90°</td><td class="mono">π/2</td><td>a quarter turn ahead</td><td>the wave has slid by ¼ of a cycle</td></tr>
          <tr><td class="mono">180°</td><td class="mono">π</td><td>half a turn ahead</td><td>the wave is <b>flipped upside down</b></td></tr>
          <tr><td class="mono">270°</td><td class="mono">3π/2</td><td>three quarters of a turn</td><td>slid by ¾</td></tr>
          <tr><td class="mono">360°</td><td class="mono">2π</td><td>full turn</td><td><b>identical to 0°</b>: you are back at the start</td></tr>
        </table>`,
      mount: el => {
        waveLab(el, {
          A: 1, f: 1, phi: 0, showPeriod: false,
          title: 'Move ONLY the phase', subtitle: 'watch: the wave slides, but does not change shape',
        });
      },
    },

    {
      t: 'Phase = delay in time (the little formula that links them)',
      html: `
        <p>Shifting the phase is the same as making the wave start a little <b>earlier</b> or a little <b>later</b>.
        The link between the two ways of saying it is simple:</p>
        <div class="formula">delay Δt = <span class="hl-k">φ</span> / (360° · <span class="hl-n">f</span>)
        &nbsp;&nbsp;&nbsp;or&nbsp;&nbsp;&nbsp; <span class="hl-k">φ</span> = 360° · <span class="hl-n">f</span> · Δt</div>
        <p>An example with real numbers: a wave at <b>f = 2 Hz</b> (one cycle lasts 0.5 s) shifted by <b>90°</b>.
        Ninety degrees is a quarter turn, so the delay is a quarter of 0.5 s, that is <b>0.125 s</b>.
        With the formula: 90/(360·2) = 0.125 s. It checks out.</p>
        <div class="callout"><b>Why it matters:</b> the phase is not an "extra" and optional piece of information.
        It is the information about <b>when</b> things happen. Two sounds with the same frequencies but different phases
        can be two different words.</div>`,
      mount: el => {
        stepper(el, [
          { h: 'Guided exercise', html: 'A wave at <b>f = 4 Hz</b>. How long does one whole cycle last?' },
          { h: 'Step 1', html: 'T = 1/f = 1/4 = <b>0.25 s</b>. This is the time for ONE full turn, that is, for 360°.' },
          { h: 'Step 2', html: 'If I shift it by <b>180°</b>, that is <b>half</b> a turn, the delay is half a period: 0.25/2 = <b>0.125 s</b>.' },
          { h: 'Step 3', html: 'Check with the formula: Δt = φ/(360·f) = 180/(360·4) = 180/1440 = <b>0.125 s</b>. ✔' },
          { h: 'Moral', html: 'The phase is a <b>clock</b>: 360° = one turn = one period. Converting phase↔time is just a proportion.' },
        ]);
      },
    },

    {
      t: 'Two waves out of phase: the most important thing in the course',
      html: `
        <p>Now the big one. Let us take <b>two</b> identical waves and change only the phase of one.
        Then we <b>add them up</b> (that is what physically happens when two sounds reach your ear together,
        or two light waves reach the same point).</p>
        <ul>
          <li>Phase difference <b>0°</b> → the two help each other: the resulting wave is <b>double</b>. That is <b>constructive interference</b>.</li>
          <li>Phase difference <b>180°</b> → one pushes up while the other pushes down: result <b>zero</b>, total silence.
              That is <b>destructive interference</b>.</li>
          <li>In between → something in between.</li>
        </ul>
        <p>In the panel below there are the <b>arrows</b>: each wave is drawn as an arrow as long as its amplitude
        and tilted as much as its phase. Adding two waves = <b>joining the two arrows head to tail</b>. Keep it in mind:
        it is literally the same drawing we will use for qubits.</p>`,
      mount: el => {
        const m = L.mission({ key: 'cancella', title: 'Silence!', text: 'find the combination that makes the sum disappear completely (bar below 0.06).', xp: 45 });
        el.appendChild(m.root);
        twoWaves(el, {
          A1: 1, p1: 0, A2: 0.6, p2: 40,
          onChange: s => { if (s.mag < 0.06) m.complete(); },
        });
      },
    },

    {
      t: 'Why complex numbers will be needed (a preview)',
      html: `
        <p>To describe a wave at a given frequency completely you need <b>two</b> numbers:
        <b>how big it is</b> (amplitude) and <b>where in the turn it is</b> (phase).</p>
        <p>Keeping two separate numbers is awkward: when you add two waves you have to do heavy trigonometry.
        But if you draw each wave as an <b>arrow</b> — length = amplitude, tilt = phase —
        then adding two waves becomes trivial: <b>you join the arrows</b>.</p>
        <div class="callout key">A <b>complex number</b> is nothing but the mathematical name of that arrow.
        It is not "imaginary" in the sense of "fake": it is a pair (length, angle) written down conveniently.
        (You built it at level 8.)</div>
        <p class="dim">A curiosity: noise-cancelling earphones contain exactly this.
        The microphone listens to the noise, the electronics generate the same wave shifted by <b>180°</b>, and the sum makes… silence.
        Destructive interference applied, sold for 300 euros.</p>`,
    },

    {
      t: '💡 Try it yourself',
      html: `<div class="callout think">
        <p><b>1.</b> In the two-wave widget, set A = 1 and B = 1 with a phase difference of 120°. How much is the sum?
        (It is neither 2 nor 0: there is a precise value and there is a geometric reason.)</p>
        <p><b>2.</b> Can you make the sum disappear if the two amplitudes are <b>different</b>? Why?</p>
        <p><b>3.</b> If you had <b>three</b> identical waves, with which phases would you make them all cancel together?
        <span class="muted">(hint: think of three arrows closing a triangle)</span></p>
        <p class="mb0"><b>4.</b> This three-way cancellation is exactly the trick the QFT will use to make
        the wrong answers disappear. Keep it aside.</p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'Two identical waves shifted by 180° are added together. What do you get?',
      options: ['A double wave', 'Zero (they cancel out)', 'A wave with double frequency', 'The same wave as before'],
      correct: 1,
      why: 'Half a turn of shift means that one is flipped with respect to the other: where one goes up the other goes down, and the sum is <b>zero</b>. That is destructive interference.' },
    { q: 'A wave at 5 Hz is shifted by 90°. How much is it "late" in time?',
      options: ['0.05 s', '0.25 s', '0.5 s', '90 s'],
      correct: 0,
      why: 'T = 1/5 = 0.2 s. Ninety degrees is a quarter turn: 0.2/4 = <b>0.05 s</b>. With the formula: 90/(360·5) = 0.05 s.' },
    { q: 'Why do you need TWO numbers to describe a wave at a given frequency?',
      options: ['Because you need amplitude and phase', 'Because you need sine and cosine separately', 'Because time is two-dimensional', 'It is not true: one is enough'],
      correct: 0,
      why: 'Amplitude (how big it is) and phase (where in the cycle it is). Two numbers = one arrow = one <b>complex number</b>. The fact that it can also be written as "so much cosine + so much sine" is the same concept seen from another angle.' },
  ],

  outro: `<div class="callout ok"><b>What you take home:</b> the phase says <b>where in the turn</b> you are;
          360° = one whole turn = one period; two waves in phase add up, two waves in opposition cancel out.
          Amplitude + phase = one arrow. Next level: how a complicated signal is built by adding up simple waves.</div>`,
});
</script>
</body>
</html>
