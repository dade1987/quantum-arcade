<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Quantum Arcade">
  <defs>
    <linearGradient id="qa-g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="qa-g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="qa-core" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#e9fbff"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="qa-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fondo arcade -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="#0a1020"/>
  <rect x="2" y="2" width="124" height="124" rx="30" fill="none" stroke="url(#qa-g1)" stroke-opacity="0.35" stroke-width="2"/>

  <g filter="url(#qa-glow)">
    <!-- la "Q": anello principale = il qubit -->
    <circle cx="60" cy="60" r="34" fill="none" stroke="url(#qa-g1)" stroke-width="7" stroke-linecap="round"/>
    <!-- coda della Q -->
    <path d="M78 78 L100 100" fill="none" stroke="url(#qa-g2)" stroke-width="9" stroke-linecap="round"/>

    <!-- orbite: le due basi di misura -->
    <ellipse cx="60" cy="60" rx="34" ry="13" fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2"
             transform="rotate(-28 60 60)"/>
    <ellipse cx="60" cy="60" rx="13" ry="34" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"
             transform="rotate(-28 60 60)"/>

    <!-- nucleo -->
    <circle cx="60" cy="60" r="9" fill="url(#qa-core)"/>

    <!-- vettore di stato -->
    <path d="M60 60 L84 38" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M84 38 l-9.5 1.6 l4.2 4.9 z" fill="#fbbf24"/>

    <!-- onda: il segnale che diventa qubit -->
    <path d="M14 106 q7 -13 14 0 t14 0 t14 0" fill="none" stroke="#34d399" stroke-opacity="0.9"
          stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- pixel arcade -->
  <g fill="#22d3ee" opacity="0.85">
    <rect x="103" y="18" width="5" height="5" rx="1"/>
    <rect x="112" y="27" width="4" height="4" rx="1"/>
    <rect x="95" y="27" width="3" height="3" rx="1" opacity="0.6"/>
  </g>
  <g fill="#f472b6" opacity="0.8">
    <rect x="18" y="24" width="4" height="4" rx="1"/>
    <rect x="27" y="17" width="3" height="3" rx="1" opacity="0.7"/>
  </g>
</svg>
