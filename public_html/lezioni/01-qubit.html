<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8 · Dal numero complesso al qubit — Quantum Arcade</title>
<meta name="description" content="Il ponte fra i numeri complessi e i qubit: ampiezze, notazione di Dirac, regola di Born, fotoni e filtri polaroid, e la differenza vera fra un qubit e una moneta truccata.">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
</head>
<body>
<div id="app"></div>
<script type="module">
import { renderLesson } from '../js/core/lesson.js';
import { formula, stepper } from '../js/core/formula.js';
import { qubitBuilder, coinVsQubit, hadamardMap } from '../js/widgets/qubit.js';
import { polaroidLab } from '../js/widgets/quantum2.js';

const L = renderLesson({
  id: '01-qubit',
  lead: `Si comincia dal pezzo grosso: <b>che cos'è un qubit</b>. Niente onde, niente numeri complessi, niente formule
         pesanti: bastano le percentuali e i numeri con il segno della Parte 0. Alla fine di questo livello saprai
         già la differenza vera fra un qubit e una moneta truccata — che è la cosa che quasi nessuno sa spiegare.`,

  steps: [
    {
      t: 'Un bit che può essere un po\' tutti e due',
      html: `<p>Un <b>bit</b> normale è una casella che contiene <b>0 oppure 1</b>. Punto. È come una lampadina:
             accesa o spenta.</p>
             <p>Un <b>qubit</b> è una casella diversa: finché non lo guardi, contiene <b>due numeri</b>,
             uno per ogni risultato possibile. Si chiamano <b>ampiezze</b>:</p>
             <pre><code>bit classico:   0        oppure        1

qubit:      [ ampiezza di 0 , ampiezza di 1 ]
             es.  [   0,6    ,     0,8      ]</code></pre>
             <p>Quando lo <b>misuri</b>, il qubit ti restituisce 0 oppure 1 (mai "0,6"): il numero che esce è casuale,
             e la probabilità si ottiene <b>elevando al quadrato</b> l'ampiezza — proprio il quadrato del livello 0·1.</p>
             <div class="formula">probabilità di leggere 0 = (0,6)² = <span class="hl-n">36%</span>
             &nbsp;&nbsp;&nbsp;&nbsp; probabilità di leggere 1 = (0,8)² = <span class="hl-k">64%</span>
             &nbsp;&nbsp;&nbsp;→&nbsp; totale <b>100%</b> ✓</div>
             <div class="callout key"><b>La cosa che cambia tutto:</b> un'ampiezza può essere <b>negativa</b>.
             Una probabilità no — non esiste "il −30% di probabilità" — ma un'ampiezza sì.
             E due ampiezze uguali e opposte, quando si incontrano, <b>si cancellano</b>:
             <code>+0,7 e −0,7 fanno 0</code>. È l'unica differenza fra un qubit e una moneta,
             ed è da lì che nasce tutta l'informatica quantistica.</div>
             <p class="dim small">Più avanti (livello 8) scopriremo che l'ampiezza, in generale, non è solo
             "positiva o negativa": è una <b>freccia</b> che può puntare in qualsiasi direzione. Ma per i primi sette livelli
             il segno + o − basta e avanza.</p>`,
    },
    {
      t: 'Il qubit fisico: un fotone e un paio di occhiali da sole',
      html: `<p>Prima della matematica, un oggetto vero. Il qubit più semplice da immaginare è la <b>polarizzazione
             di un fotone</b>: la direzione lungo cui oscilla il suo campo elettrico.</p>
             <ul>
               <li>fotone polarizzato <b>verticalmente</b> → lo chiamiamo <b>|0⟩</b></li>
               <li>fotone polarizzato <b>orizzontalmente</b> → lo chiamiamo <b>|1⟩</b></li>
               <li>fotone polarizzato <b>a 45°</b> → è una <b>sovrapposizione</b> dei due</li>
             </ul>
             <p>Un filtro polaroid (quello degli occhiali da sole) lascia passare solo la luce polarizzata lungo una certa
             direzione. Se il fotone è "obliquo" rispetto al filtro, passa <b>con una certa probabilità</b>:</p>
             <div class="formula">probabilità di passare = cos²(angolo fra fotone e filtro) &nbsp;&nbsp;<span class="muted">(legge di Malus)</span></div>
             <p>Riconosci il coseno del livello 0·3 e il quadrato del livello 0·1? Ecco da dove viene, fisicamente,
             la regola "probabilità = ampiezza²": l'ampiezza è il <b>coseno dell'angolo</b>, la probabilità è il suo quadrato.</p>
             <p><b>Adesso l'esperimento che fa impazzire tutti.</b> Metti due filtri incrociati (0° e 90°): non passa niente,
             buio totale. Poi <b>infila un terzo filtro a 45° in mezzo ai due</b>. Secondo il buon senso dovrebbe passare
             ancora meno luce. Invece la luce <b>ripassa</b>. Provalo:</p>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'polaroid', title: 'Il paradosso dei tre filtri', text: 'metti due filtri incrociati (0° e 90°), poi aggiungi quello in mezzo a 45° e fai ripassare la luce.', xp: 40 });
        el.appendChild(m.root);
        polaroidLab(el, { onDiscover: () => m.complete() });
      },
      after: `<div class="callout key"><b>Cosa ci insegna:</b> un filtro non <i>seleziona</i> i fotoni che erano già giusti.
              Il filtro <b>misura</b>, e la misura <b>riscrive</b> lo stato: dopo il filtro a 45°, il fotone <b>è</b> a 45°,
              e da lì ha di nuovo il 50% di probabilità di passare a 90°. La misura in fisica quantistica non è
              "guardare senza toccare": è un'operazione che cambia il sistema.</div>`,
    },
    {
      t: 'Come si scrive uno stato: la notazione di Dirac',
      html: `<p>I fisici scrivono gli stati fra due simboli buffi: <b>|</b> e <b>⟩</b>. Si chiama <i>ket</i> ed è
             solo una scatola per dire "questo è uno stato". <code>|0⟩</code> si legge "ket zero".</p>
             <p>Uno stato generico di un qubit si scrive così:</p>`,
      mount: el => {
        formula(el, {
          title: 'Lo stato di un qubit — tocca ogni pezzo',
          parts: [
            { t: '|ψ⟩', id: 'psi', color: 'cyan', name: 'lo stato del qubit', say: 'ψ (psi) è solo il nome che diamo allo stato, come chiamare "x" un\'incognita. Le stanghette |…⟩ dicono "qui dentro c\'è uno stato quantistico".' },
            { t: '=' },
            { t: 'a', id: 'a', color: 'green', name: 'ampiezza del risultato 0', say: 'Un numero: per adesso positivo o negativo (al livello 8 diventerà una freccia che può puntare ovunque). Il suo QUADRATO è la probabilità di misurare 0.', ex: 'a = 0,707 → probabilità di 0 = 0,707² = 0,5 = 50%.' },
            { t: '|0⟩', id: 'k0', color: 'green', name: 'il risultato "zero"', say: 'L\'etichetta della prima possibilità. Nel fotone: polarizzazione verticale.' },
            { t: '+' },
            { t: 'b', id: 'b', color: 'amber', name: 'ampiezza del risultato 1', say: 'L\'ampiezza dell\'altro risultato. Può essere negativa: −0,707 dà la stessa probabilità di +0,707, ma è uno stato DIVERSO.', ex: 'a = 0,707 e b = −0,707 → 50% e 50%, esattamente come con b = +0,707… ma le due si comportano in modo opposto quando applichi una porta H.' },
            { t: '|1⟩', id: 'k1', color: 'amber', name: 'il risultato "uno"', say: 'La seconda possibilità. Nel fotone: polarizzazione orizzontale.' },
            { t: '  con  ' },
            { t: '|a|² + |b|² = 1', id: 'norm', color: 'violet', name: 'la regola di normalizzazione', say: 'Le probabilità devono sommare a 1 (livello 0·4!). Questo vincola le lunghezze delle due frecce: se una cresce, l\'altra cala.', ex: 'a = 0,6 e b = 0,8 → 0,36 + 0,64 = 1 ✓' },
          ],
        });
      },
      after: `<div class="callout"><b>La regola di Born</b> (il collegamento fra matematica e realtà):
              la probabilità di ottenere un certo risultato è il <b>quadrato della lunghezza</b> della sua freccia.
              <code>P(0) = |a|²</code>, <code>P(1) = |b|²</code>. Nient'altro serve per prevedere qualunque esperimento quantistico.</div>`,
    },
    {
      t: 'Costruisci il tuo qubit (e scopri la manopola invisibile)',
      html: `<p>Nel gioco: <b>θ</b> decide quanto |1⟩ c'è (cioè la "spartizione" delle probabilità),
             <b>φ</b> è la <b>fase</b> della seconda freccia.</p>
             <p><b>Esperimento obbligatorio:</b> tieni θ fermo e muovi <b>solo φ</b>. Guarda l'istogramma delle misure:
             <b>non cambia nulla</b>. Le probabilità sono identiche. Eppure lo stato è diverso — e la freccia di destra ruota.</p>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'meta', title: 'Cinquanta e cinquanta', text: 'porta il qubit a esattamente 50% e 50% (indizio: θ = 90°) e misuralo 100 volte.', xp: 35 });
        el.appendChild(m.root);
        qubitBuilder(el);
        let done = false;
        el.addEventListener('click', () => {
          if (done) return;
          const t = el.querySelector('input[type=range]');
          if (t && Math.abs(parseFloat(t.value) - 90) < 3) { done = true; m.complete(); }
        });
      },
      after: `<div class="callout warn"><b>La fase è invisibile a una misura sola.</b> È il motivo per cui molti si convincono
              che il qubit sia "solo una moneta truccata": se guardi soltanto le percentuali, sembra proprio così.
              Il prossimo passo smonta questa idea in modo definitivo.</div>`,
    },
    {
      t: 'La prova del nove: moneta contro qubit',
      html: `<p>Facciamo l'esperimento decisivo. Da una parte una <b>moneta</b> mescolata due volte.
             Dall'altra un <b>qubit</b> a cui applichiamo due volte la porta <b>H</b> (Hadamard), che è l'operazione
             che "mescola" un qubit portandolo in sovrapposizione 50/50.</p>
             <p>Se il qubit fosse una moneta, dopo due mescolate dovrebbe restare casuale. Guarda cosa succede:</p>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'hh', title: 'Il colpo di scena', text: 'lancia l\'esperimento e guarda il qubit tornare sempre a 0.', xp: 45 });
        el.appendChild(m.root);
        coinVsQubit(el, { onDiscover: () => m.complete() });
      },
      after: `<p>Perché? Perché H non produce "0 oppure 1 al 50%": produce <b>due frecce</b>. E la seconda H le fa
              <b>incontrare</b>. Sul risultato |1⟩ arrivano due contributi uguali e <b>opposti</b> (uno con il +, uno con il −)
              e si <b>cancellano</b>: l'<b>interferenza distruttiva</b>: la studieremo a fondo al livello 7, ma l'hai appena vista funzionare.</p>`,
    },
    {
      t: 'Le quattro righe della porta H (imparale, tornano sempre)',
      html: `<p>Hadamard fa esattamente questo, e non c'è altro da sapere:</p>
             <div class="formula">
               H|0⟩ = (|0⟩ + |1⟩)/√2 &nbsp;&nbsp;&nbsp;&nbsp; H|1⟩ = (|0⟩ <span class="hl-x">−</span> |1⟩)/√2
             </div>
             <p>L'unica differenza fra le due righe è quel <b>meno</b>. E il meno, dal livello 0·1, sai cos'è:
             <b>«dalla parte opposta»</b>. Da quel singolo segno nasce tutta l'interferenza quantistica.</p>`,
      mount: el => {
        hadamardMap(el);
        stepper(el, [
          { h: 'Facciamo il conto di H·H|0⟩', html: 'Partiamo da |0⟩. Prima H: otteniamo <code>(|0⟩ + |1⟩)/√2</code>.' },
          { h: 'Seconda H, pezzo per pezzo', html: 'Applichiamo H a ciascun pezzo:<br><code>H|0⟩ = (|0⟩ + |1⟩)/√2</code><br><code>H|1⟩ = (|0⟩ − |1⟩)/√2</code>' },
          { h: 'Sommiamo', html: '<code>(1/√2)[(|0⟩+|1⟩)/√2 + (|0⟩−|1⟩)/√2]</code> = <code>(1/2)[|0⟩ + |1⟩ + |0⟩ − |1⟩]</code>' },
          { h: 'Guarda i termini con |1⟩', html: '<code>+|1⟩</code> e <code>−|1⟩</code>: si <b>cancellano</b>. Restano due |0⟩ su 2, cioè <code>|0⟩</code>.' },
          { h: 'Risultato', html: '<b>H·H|0⟩ = |0⟩</b> con probabilità 100%. Nessuna moneta si comporta così. Il qubit sì, perché le sue "probabilità" hanno un <b>segno</b>.' },
        ], { doneLabel: 'Ho capito il meno!' });
      },
    },
    {
      t: '💡 Prova tu',
      html: `<div class="callout think">
        <p><b>1.</b> Nel costruttore, trova due valori di φ diversi che diano <b>esattamente</b> le stesse probabilità.
           Quanti ce ne sono? <span class="muted">(infiniti: la fase non si vede in una misura sola)</span></p>
        <p><b>2.</b> Nel gioco dei polaroid, con i filtri a 0° e 90° e uno in mezzo a 30°: passa più o meno luce che con 45°?
           Prova a prevederlo prima di muovere il cursore.</p>
        <p><b>3.</b> Se |a| = 0,6, quanto vale |b|? <span class="muted">(0,8: perché 0,36 + 0,64 = 1)</span></p>
        <p class="mb0"><b>4.</b> Domanda che apre il resto del corso: se la fase non si vede misurando,
           <b>a cosa serve</b>? <i>(Risposta breve: a decidere cosa si cancellerà. Risposta lunga: i livelli da 14 a 19.)</i></p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'Se l\'ampiezza di |1⟩ vale 0,6, qual è la probabilità di misurare 1?',
      options: ['60%', '36%', '80%', '6%'], correct: 1,
      why: 'Regola di Born: probabilità = |ampiezza|² = 0,6² = 0,36 = <b>36%</b>. È l\'errore più comune di tutti: l\'ampiezza NON è la probabilità.' },
    { q: 'Due stati con le stesse probabilità ma fase diversa sono…',
      options: ['identici', 'diversi, e la differenza si vede applicando altre porte', 'impossibili', 'sempre entangled'], correct: 1,
      why: 'Una singola misura non li distingue, ma una porta successiva (per esempio H) li porta a risultati diversi: la fase decide cosa si cancellerà.' },
    { q: 'Perché due Hadamard di fila riportano il qubit a |0⟩?',
      options: ['perché H è casuale', 'perché i contributi a |1⟩ arrivano con segno opposto e si cancellano', 'perché H misura il qubit', 'perché |1⟩ è instabile'], correct: 1,
      why: 'Interferenza distruttiva: +|1⟩ e −|1⟩ si annullano, mentre i due contributi a |0⟩ si sommano. Con una moneta non potrebbe mai succedere.' },
    { q: 'Nell\'esperimento dei tre filtri polaroid, aggiungere un filtro a 45° fra due incrociati…',
      options: ['blocca ancora più luce', 'fa ripassare la luce, perché la misura riscrive lo stato', 'non cambia nulla', 'funziona solo con il laser'], correct: 1,
      why: 'Il filtro non seleziona: misura. Dopo il filtro a 45° il fotone <b>è</b> a 45°, quindi ha di nuovo il 50% di probabilità di attraversare il filtro a 90%.' },
  ],

  outro: `<div class="callout ok"><b>Cosa ti porti a casa:</b> un qubit = due frecce (ampiezze complesse);
          probabilità = lunghezza²; la fase non si vede in una misura ma decide le interferenze future;
          la misura <b>modifica</b> lo stato. Prossimo livello: un modo per vedere tutto questo in un colpo d'occhio,
          la <b>sfera di Bloch</b>.</div>`,
});
</script>
</body>
</html>
