<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sintesi di Fourier giocando: ricostruisci un segnale misterioso sommando onde semplici e scopri come si costruisce un'onda quadra.">
<title>3 · Somma di onde — Quantum Arcade</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
</head>
<body>
<div id="app"></div>

<script type="module">
import { renderLesson } from '../js/core/lesson.js';
import { formula } from '../js/core/formula.js';
import { synthLab, squareLab } from '../js/widgets/synth.js';

const L = renderLesson({
  id: '15-somma-onde',
  lead: `L'idea più potente di tutta la matematica applicata, in una riga: <b>qualunque segnale ragionevole
         si può ottenere sommando onde semplici</b>. Qui la usiamo al contrario e diventa un gioco: indovinare la ricetta.`,

  steps: [
    {
      t: 'La macedonia',
      html: `
        <p>Hai un frullato. Lo assaggi e ti chiedi: <b>quanta mela c'è? quanta pera? quanta banana?</b></p>
        <p>Con i segnali è identico. Un suono registrato è un frullato di frequenze: dentro ci sono
        contemporaneamente 100 Hz, 300 Hz, 1000 Hz… tutte mischiate in un unico grafico che sale e scende
        in modo apparentemente incomprensibile.</p>
        <div class="callout key"><b>Fourier dice:</b> quel disegno complicato è <b>solo</b> una somma di onde tonde,
        ognuna con la sua ampiezza e la sua fase. Se trovo la lista delle quantità, ho capito tutto del segnale.</div>
        <p>La lista delle quantità si chiama <b>spettro</b>. È la "ricetta" del segnale:</p>
        <div class="formula">
          segnale = <span class="hl-x">3</span>·onda(10 Hz) + <span class="hl-x">0,5</span>·onda(20 Hz) + <span class="hl-x">7</span>·onda(50 Hz) + …
        </div>
        <p>Quei numeri (3 · 0,5 · 7) sono le ampiezze delle varie frequenze. Dicono <b>quanto</b> ogni ingrediente
        contribuisce al risultato finale.</p>`,
    },

    {
      t: 'Missione: indovina la ricetta',
      html: `
        <p>Nel gioco qui sotto c'è un <b>segnale misterioso</b> (rosa tratteggiato) costruito mescolando onde da
        1, 2, 3, 4 e 5 Hz. Tu hai cinque cursori: uno per ogni ingrediente.</p>
        <p><b>Come si gioca bene:</b> non andare a caso. Guarda il segnale misterioso e chiediti "quanti gobbe grandi ci sono
        in un secondo?" — quella è la frequenza dominante. Alza quel cursore per primo, poi aggiusta gli altri.
        Puoi anche <b>ascoltare</b> i due segnali e confrontarli a orecchio.</p>`,
      mount: el => {
        const m = L.mission({ key: 'ricetta', title: 'Chef di Fourier', text: 'porta l\'errore sotto 0,10 ricostruendo il segnale misterioso.', xp: 50 });
        el.appendChild(m.root);
        synthLab(el, { nComp: 5, onSolve: () => m.complete() });
      },
      after: `<div class="callout"><b>Quello che hai appena fatto a mano</b> è esattamente il lavoro che la trasformata di Fourier
              fa da sola, in un colpo solo e senza tentativi. Nel livello 16 vedremo <b>come</b> fa.</div>`,
    },

    {
      t: 'Anche gli spigoli si fanno con le curve',
      html: `
        <p>Obiezione ragionevole: "va bene per i segnali morbidi, ma un'onda <b>quadra</b> ha gli spigoli.
        Come fai a fare uno spigolo sommando curve tonde?"</p>
        <p>Risposta: ne servono tante, e per farla <b>perfetta</b> ne servirebbero infinite. Ma già con dieci ci siamo quasi.
        La ricetta dell'onda quadra è bellissima perché è regolarissima: solo le frequenze <b>dispari</b>, ognuna con ampiezza
        <b>1/k</b> (cioè quelle alte contano sempre meno):</p>
        <div class="formula">quadra(t) = (4/π) · [ sin(2πt) + <span class="hl-n">⅓</span>·sin(3·2πt) + <span class="hl-n">⅕</span>·sin(5·2πt) + <span class="hl-n">⅐</span>·sin(7·2πt) + … ]</div>
        <p>Muovi il cursore e guarda la curva ciano avvicinarsi allo spigolo rosa.</p>`,
      mount: el => squareLab(el),
      after: `<p class="dim small">Quelle piccole "orecchie" che restano vicino allo spigolo, e che non spariscono mai del tutto,
              hanno un nome: <b>fenomeno di Gibbs</b>. Non è un errore del gioco: succede davvero, anche nei veri sistemi audio.</p>`,
    },

    {
      t: 'Scriviamolo in matematica (senza paura)',
      html: `<p>Quello che hai fatto con i cursori, scritto come lo scrive un matematico, è questo:</p>`,
      mount: el => {
        formula(el, {
          title: 'Sintesi: dal ricettario al segnale',
          hint: 'Tocca ogni pezzo: la formula dice esattamente quello che hai fatto con i cursori.',
          parts: [
            { t: 'x(t)', id: 'x', color: 'cyan', name: 'il segnale finale', say: 'Il frullato: quello che vedi sul grafico o che senti dall\'altoparlante.' },
            { t: '=' },
            { t: 'Σ', id: 'sum', color: 'green', name: 'somma di tutti gli ingredienti', say: 'La sigma greca vuol dire soltanto "somma tutto quello che segue, per ogni valore di k". È il modo breve per scrivere "primo + secondo + terzo + …".', ex: 'Con k che va da 1 a 3: Σ = (pezzo con k=1) + (pezzo con k=2) + (pezzo con k=3).' },
            { t: 'A', id: 'A', color: 'amber', name: 'quanto ce n\'è', say: 'La posizione del cursore: quanto di quella frequenza mettiamo nella ricetta. Se è 0, quell\'ingrediente non c\'è.', ex: 'A₃ = 0,7 → l\'onda da 3 Hz entra con peso 0,7.' },
            { t: '_k', id: 'k', color: 'violet', name: 'quale ingrediente', say: 'L\'indice k dice DI QUALE frequenza stiamo parlando: k=1 la più lenta, k=2 il doppio più veloce, e così via.' },
            { t: '·cos(2π' },
            { t: 'k', id: 'k2', color: 'violet', name: 'la frequenza k-esima', say: 'Moltiplicando k dentro il coseno, l\'onda gira k volte più veloce: è l\'armonica numero k.' },
            { t: 'f₀t +' },
            { t: 'φ', id: 'phi', color: 'pink', name: 'la fase di quell\'ingrediente', say: 'Ogni ingrediente può anche essere spostato nel tempo. Nel gioco l\'abbiamo tenuta a zero per semplicità, ma in generale ogni frequenza ha la sua fase.' },
            { t: '_k)' },
          ],
        });
      },
      after: `<div class="callout ok"><b>Tradotto in italiano:</b> "prendi tutte le frequenze, moltiplica ognuna per quanto ne vuoi,
              spostale della fase giusta, somma tutto". Fine. Non c'è altro.</div>`,
    },

    {
      t: '💡 Prova tu',
      html: `<div class="callout think">
        <p><b>1.</b> Nel gioco della ricetta: se metti <b>tutti</b> i cursori al massimo, che forma esce? Assomiglia a qualcosa che conosci?</p>
        <p><b>2.</b> Genera un nuovo segnale misterioso e prova a indovinarlo <b>solo ascoltando</b>, senza guardare il grafico.
           Riesci a sentire quale frequenza manca?</p>
        <p><b>3.</b> Nell'onda quadra le armoniche pari sono assenti. Prova a immaginare che forma avresti sommando solo le <b>pari</b>.</p>
        <p class="mb0"><b>4.</b> Domanda seria: dato un segnale, esiste <b>una sola</b> ricetta possibile o potrebbero essercene tante diverse
           che danno lo stesso risultato? <i>(La risposta — una sola — è il motivo per cui Fourier funziona ed è alla base del livello 16.)</i></p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'Cosa vuol dire "spettro di un segnale"?',
      options: ['Il suo grafico nel tempo', 'La lista di quanto c\'è di ogni frequenza', 'La sua ampiezza massima', 'Il suo periodo'],
      correct: 1,
      why: 'Lo spettro è la <b>ricetta</b>: per ogni frequenza dice quanto ne contiene il segnale (e, in generale, con quale fase).' },
    { q: 'Per costruire un\'onda quadra perfetta servono…',
      options: ['due onde', 'solo le frequenze pari', 'infinite armoniche dispari', 'un\'onda quadra: non si può fare con le sinusoidi'],
      correct: 2,
      why: 'Servono <b>infinite</b> armoniche dispari con ampiezza 1/k. Con poche armoniche si ottiene un\'ottima approssimazione, con le tipiche "orecchie" di Gibbs vicino allo spigolo.' },
    { q: 'Il simbolo Σ in una formula significa…',
      options: ['moltiplica', 'somma tutti i pezzi', 'integra', 'la deviazione standard'],
      correct: 1,
      why: 'È solo un modo compatto per scrivere "primo + secondo + terzo + …". Ogni volta che vedi Σ, leggi <b>"somma tutti"</b> e la formula smette di fare paura.' },
  ],

  outro: `<div class="callout ok"><b>Cosa ti porti a casa:</b> ogni segnale = somma di onde semplici; la lista delle quantità si chiama
          <b>spettro</b>; costruire il segnale dalla ricetta si chiama <b>sintesi</b>. Adesso ci serve l'attrezzo per fare il contrario
          (dal segnale alla ricetta): e quell'attrezzo è fatto di <b>frecce che girano</b>. Livello 16.</div>`,
});
</script>
</body>
</html>
