<script type="module">
import { renderLesson } from '../js/core/lesson.js';
import { nOf } from '../js/core/levels.js';   // i numeri di livello si calcolano, non si scrivono
import { tabellaGlossario } from '../js/widgets/glossario.js';

const L = renderLesson({
  id: '23-glossario',
  lead: `Tutto il vocabolario in una pagina sola, nell'ordine in cui l'hai incontrato — così puoi tornarci ogni volta
         che una parola ti sfugge. In fondo c'è il <b>filo</b> completo: come si arriva da "2 + 2" a Shor senza salti.`,

  steps: [
    {
      t: 'Il filo conduttore, dall\'inizio alla fine',
      html: `<pre style="line-height:1.75"><code>numeri con il segno (0·1)
   └─ probabilità = quadrato (0·1) ────────────────┐
coordinate e gradi (0·2)                           │
   └─ freccia = punto = coppia di numeri           │
seno e coseno = ombre di un punto che gira (0·3)   │
probabilità e frequenze (0·4)                      │
                                                   ▼
QUBIT = due ampiezze (1) ── misura → |ampiezza|² ──┘
   ├─ sfera di Bloch: latitudine = probabilità, longitudine = fase (2)
   ├─ porte = rotazioni; H·Z·H = X (3)
   ├─ due qubit → 4 ampiezze → ENTANGLEMENT (4)
   ├─ circuiti (5)
   └─ no-cloning → teletrasporto (6)
                    │
INTERFERENZA: le ampiezze si sommano, poi si eleva al quadrato (7)
   └─ due segni non bastano → FRECCE COMPLESSE, e^{iθ} (8)
                    │
   ├─ oracolo: scrive nelle fasi → Deutsch–Jozsa (9)
   ├─ stringa segreta nelle fasi → Bernstein–Vazirani (10)
   └─ amplificazione → Grover (11)
                    │
ONDE: ampiezza, periodo, frequenza (${nOf('13-onde')}) → fase (${nOf('14-fase')}) → somma di onde (${nOf('15-somma-onde')})
   └─ DFT: "ruota e somma" trova le periodicità (${nOf('16-dft')}) → FFT (${nOf('17-fft')})
                    │
QFT = DFT sulle ampiezze, con n²/2 porte (${nOf('18-qft')})
   ├─ QPE: leggere una fase come numero (${nOf('19-qpe')})
   └─ SHOR: periodo → picchi → frazioni continue → fattori (${nOf('20-shor')})
                    │
rumore e correzione d'errore (${nOf('21-rumore')}) · officina creativa (${nOf('22-officina')}) · esame (${nOf('24-esame')})</code></pre>
             <div class="callout key"><b>Se dovessi riassumere l'intero corso in una frase:</b>
             «Un computer quantistico esplora tutte le possibilità insieme e organizza le <b>fasi</b> in modo che
             le risposte sbagliate si <b>cancellino</b> e quella giusta diventi <b>molto probabile</b>.»
             Tutto il resto sono dettagli tecnici su come si organizzano quelle fasi.</div>`,
    },
    {
      t: 'Glossario A–Z',
      html: `<p class="dim">La stessa tabella che segue l'hai avuta a disposizione fin dal primo livello: il
             pannello <b>📖 Glossario</b> in alto — o il tasto <b>G</b> — la apre di fianco al testo in qualsiasi
             pagina, con la ricerca per parola e per livello. Qui è per intero, da leggere di fila.</p>`,
      mount: host => host.appendChild(tabellaGlossario()),
    },
    {
      t: 'Gli errori più comuni (che ora sai riconoscere)',
      html: `<div class="grid-2">
               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "Prova tutte le soluzioni in parallelo"</h3>
                 <p class="mb0 dim">Le esplora tutte, ma <b>ne può leggere una sola</b>. Il vantaggio nasce dall'interferenza
                 che elimina le sbagliate, non dal parallelismo in sé.</p></div>
               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "Un qubit è 0 e 1 insieme"</h3>
                 <p class="mb0 dim">È una lista di <b>ampiezze</b>, cioè di frecce. Il "0 e 1 insieme" non spiega perché
                 due Hadamard riportino il qubit a zero: le frecce sì.</p></div>
               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "L'ampiezza è la probabilità"</h3>
                 <p class="mb0 dim">La probabilità è il suo <b>quadrato</b>. Ampiezza 0,6 → probabilità 36%, non 60%.</p></div>
               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "L'entanglement trasmette informazione istantanea"</h3>
                 <p class="mb0 dim">No: chi sta dall'altra parte vede solo esiti casuali. Per usarli serve un canale classico
                 normale (teletrasporto, livello 6).</p></div>
               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "I computer quantistici sostituiranno i nostri"</h3>
                 <p class="mb0 dim">Sono acceleratori specializzati per pochi problemi con struttura adatta.
                 Per scrivere una mail resteranno inutili per sempre.</p></div>
               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "La QFT è una FFT più veloce"</h3>
                 <p class="mb0 dim">Trasforma 2^n ampiezze con n²/2 porte, ma non puoi leggerle: serve a far interferire,
                 non a produrre spettri.</p></div>
             </div>`,
    },
    {
      t: 'Dove continuare',
      html: `<ul>
               <li><b>Qiskit</b> (IBM, Python) — il modo più diretto per far girare i circuiti che hai costruito qui
                   su simulatori seri e su hardware reale, gratuitamente.</li>
               <li><b>Nielsen &amp; Chuang</b>, <i>Quantum Computation and Quantum Information</i> — il libro di riferimento.
                   Dopo questo corso, i primi capitoli ti saranno familiari.</li>
               <li><b>Certificazioni riconosciute</b>: se ti serve un titolo spendibile, guarda alla certificazione
                   ufficiale di IBM su Qiskit e ai corsi universitari online (edX, Coursera) rilasciati da atenei accreditati.
                   L'attestato del prossimo livello è dell'autore di questo corso, non di un ente accreditato: serve a
                   dimostrare il percorso fatto, non a sostituire una certificazione ufficiale.</li>
               <li><b>Il mio canale YouTube</b> e gli articoli su <b>Red Hot Cyber</b>, linkati in home.</li>
             </ul>`,
    },
  ],

  quiz: [
    { q: 'Qual è il riassunto corretto del vantaggio quantistico?',
      options: ['prova tutte le soluzioni e legge la migliore', 'organizza le fasi in modo che le risposte sbagliate si cancellino', 'è semplicemente più veloce', 'usa più memoria'], correct: 1,
      why: 'Esplorare tutto è gratis; il difficile è <b>leggere</b>. L\'interferenza serve a rendere molto probabile la risposta giusta.' },
    { q: 'Ampiezza 0,6: qual è la probabilità?',
      options: ['60%', '36%', '6%', '80%'], correct: 1,
      why: 'Regola di Born: 0,6² = 0,36.' },
    { q: 'L\'entanglement permette comunicazione più veloce della luce?',
      options: ['sì', 'no: gli esiti sono casuali e serve un canale classico', 'solo con i fotoni', 'solo su brevi distanze'], correct: 1,
      why: 'Le correlazioni si vedono solo confrontando i risultati, e il confronto viaggia a velocità normale.' },
  ],

  outro: `<div class="callout ok">Hai tutto. Resta solo una cosa: <b>l'esame finale</b>. Domande su tutto il percorso,
          tempo libero, tentativi illimitati — e, dall'80% in su, il tuo attestato.</div>`,
});
