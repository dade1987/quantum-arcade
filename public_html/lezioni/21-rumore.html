<meta name="description" content="Decoerenza, rumore quantistico e correzione d'errore spiegati semplice: perché i computer quantistici sbagliano, come si difendono e a che punto siamo davvero.">

<div id="app"></div>
<script type="module">
import { renderLesson } from '../js/core/lesson.js';
import { stepper } from '../js/core/formula.js';
import { circuitLab } from '../js/widgets/circuit.js';

const L = renderLesson({
  id: '21-rumore',
  lead: `Domanda legittima dopo Shor: <b>perché non ce l'ho ancora in tasca?</b> Risposta: perché un qubit reale è
         un oggetto fragilissimo, e l'universo intero cospira per rovinarlo. Questo livello racconta il nemico
         e le contromisure — senza sensazionalismi in nessuna delle due direzioni.`,

  steps: [
    {
      t: 'Il nemico si chiama decoerenza',
      html: `<p>Un qubit resta utile finché mantiene le sue <b>relazioni di fase</b>: sono quelle che permettono
             l'interferenza (livello 7). Il problema è che <b>qualunque</b> interazione con l'esterno —
             una vibrazione, un fotone di troppo, un campo magnetico vagante — funziona come una <b>misura</b>
             e distrugge quelle relazioni.</p>
             <div class="callout key"><b>Decoerenza:</b> il processo per cui l'ambiente "misura" involontariamente il sistema,
             trasformando una sovrapposizione coerente in una banale mescolanza casuale. Da lì in poi il qubit è
             una moneta truccata, e tutto il vantaggio quantistico svanisce.</div>
             <p>È anche il motivo per cui <b>non vediamo</b> gatti in sovrapposizione: un oggetto macroscopico interagisce
             con miliardi di miliardi di particelle al secondo, quindi decoerisce in tempi inimmaginabilmente brevi.
             La quantistica non "smette di valere" per le cose grandi — semplicemente diventa invisibile in fretta.</p>
             <table class="table">
               <tr><th>Tipo di errore</th><th>Cosa fa</th><th>Analogia classica</th></tr>
               <tr><td><b>Bit flip</b> (X)</td><td>scambia |0⟩ e |1⟩</td><td>un bit che si ribalta</td></tr>
               <tr><td><b>Phase flip</b> (Z)</td><td>cambia il segno di |1⟩</td><td><b>non esiste</b> nel classico!</td></tr>
               <tr><td><b>Rilassamento (T1)</b></td><td>il qubit "cade" da |1⟩ a |0⟩</td><td>una batteria che si scarica</td></tr>
               <tr><td><b>Defasamento (T2)</b></td><td>la fase si perde gradualmente</td><td>due orologi che si sfasano</td></tr>
             </table>
             <p class="dim small">T1 e T2 sono i due numeri che troverai in ogni scheda tecnica di un processore quantistico:
             i tempi tipici sono oggi dell'ordine dei <b>microsecondi o centinaia di microsecondi</b>. Ogni porta dura
             decine di nanosecondi: ecco perché il numero di operazioni eseguibili prima che tutto si sfaldi è limitato.</p>`,
    },
    {
      t: 'Perché correggere gli errori è difficilissimo',
      html: `<p>Nel classico la correzione è banale: copi ogni bit tre volte e voti a maggioranza.
             Nel quantistico questa strada è chiusa <b>per legge</b>:</p>
             <ul>
               <li><b>Non puoi copiare</b> lo stato (no-cloning, livello 6).</li>
               <li><b>Non puoi guardare</b> se c'è un errore: guardare = misurare = distruggere la sovrapposizione.</li>
               <li>Gli errori non sono discreti: una rotazione può essere di <b>0,3 gradi</b>, non solo "sì/no".</li>
             </ul>
             <div class="callout key"><b>Il colpo di genio (Shor 1995, Steane 1996):</b> si può misurare l'errore
             <b>senza misurare l'informazione</b>. Si aggiungono qubit ausiliari e si misurano <i>relazioni</i> fra i qubit
             ("questi due sono uguali?") invece dei loro valori. La risposta rivela <b>dove</b> è successo qualcosa,
             senza rivelare <b>cosa</b> contiene lo stato. Si chiama misura di <b>sindrome</b>.</div>
             <p>E il problema degli errori "continui"? Si risolve da solo: misurare la sindrome costringe l'errore a
             <b>collassare</b> in uno discreto — o bit flip, o phase flip, o entrambi. Correggere quei tre casi basta
             per correggere <b>qualunque</b> errore.</p>`,
      mount: el => {
        stepper(el, [
          { h: 'Codice a 3 qubit (bit flip)', html: 'Si codifica <code>|0⟩ → |000⟩</code> e <code>|1⟩ → |111⟩</code> con due CNOT. Non è una copia (le sovrapposizioni diventano <code>a|000⟩ + b|111⟩</code>, non tre qubit indipendenti): è un <b>codice</b>.' },
          { h: 'Arriva l\'errore', html: 'Un X colpisce il secondo qubit: lo stato diventa <code>a|010⟩ + b|101⟩</code>.' },
          { h: 'Misura di sindrome', html: 'Si chiede: "primo e secondo sono uguali?" (no) e "secondo e terzo sono uguali?" (no). Da queste due risposte si deduce che il colpevole è il <b>secondo</b> qubit — senza aver imparato nulla su a e b!' },
          { h: 'Correzione', html: 'Si applica X al secondo qubit e lo stato torna esatto. L\'informazione quantistica è sopravvissuta a un errore.' },
          { h: 'E i phase flip?', html: 'Stesso codice, ma applicato "ruotato" con delle Hadamard: un phase flip in base Z è un bit flip in base X. Il codice di Shor a <b>9 qubit</b> combina i due e corregge qualunque errore singolo.' },
          { h: 'Il prezzo', html: 'Uno stato logico affidabile costa <b>tantissimi</b> qubit fisici. Con i codici di superficie di oggi si parla di <b>1.000–10.000 qubit fisici per ogni qubit logico</b>. Ecco perché per Shor su RSA-2048 servono milioni di qubit fisici.' },
        ], { doneLabel: 'Ho capito la sindrome!' });
      },
    },
    {
      t: 'Provalo: costruisci il codice e rompilo',
      html: `<p>Nel simulatore: costruisci la codifica <b>H su q0 → CNOT q0→q1 → CNOT q0→q2</b>
             (ottieni <code>(|000⟩ + |111⟩)/√2</code>). Poi <b>inserisci un errore</b> mettendo una X su un qubit qualsiasi
             e guarda come cambia lo stato: compaiono componenti che prima non c'erano
             (per esempio |010⟩ e |101⟩), ed è proprio quella "impronta" che la sindrome sa riconoscere.</p>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'code3', title: 'Codifica e guasto', text: 'costruisci lo stato (|000⟩+|111⟩)/√2 e poi introduci un errore X su un qubit.', xp: 55 });
        el.appendChild(m.root);
        circuitLab(el, {
          n: 3, maxCols: 8, preset: 'ghz',
          title: 'Laboratorio del codice a 3 qubit', subtitle: 'codifica, guasto, impronta',
          onChange: ({ ops, state }) => {
            const hasX = ops.some(o => o.g === 'X' && (!o.c || !o.c.length));
            const p = i => state.re[i] ** 2 + state.im[i] ** 2;
            const enc = ops.filter(o => o.g === 'X' && o.c && o.c.length).length >= 2;
            if (enc && hasX && p(0) < 0.4 && p(7) < 0.4) m.complete();
          },
        });
      },
    },
    {
      t: 'A che punto siamo davvero (agosto 2026)',
      html: `<p>Due letture opposte circolano nei giornali, e sono entrambe sbagliate:</p>
             <div class="grid-2">
               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "È tutto già pronto"</h3>
                 <p class="mb0 dim">Falso. I processori attuali hanno centinaia di qubit fisici rumorosi
                 (era <b>NISQ</b>: Noisy Intermediate-Scale Quantum). Nessun algoritmo di utilità commerciale
                 gira meglio che su un buon computer classico. Molti annunci di "vantaggio quantistico"
                 sono stati successivamente ridimensionati da simulazioni classiche più furbe.</p></div>
               <div class="panel"><h3 class="panel-title" style="margin-top:0"><span class="dot"></span>❌ "È tutta fuffa"</h3>
                 <p class="mb0 dim">Falso anche questo. La correzione d'errore ha superato la soglia di dimostrazione
                 sperimentale: si è mostrato che aumentando il numero di qubit fisici l'errore logico <b>scende</b>,
                 che era il punto teorico critico. La strada è ingegneristicamente durissima ma non è bloccata da
                 nessun ostacolo di principio.</p></div>
             </div>
             <p><b>Cosa guardare per capire i progressi</b>, invece dei titoli sensazionalistici:</p>
             <ul>
               <li>il numero di <b>qubit logici</b> (non fisici) e il loro tasso di errore;</li>
               <li>la <b>profondità di circuito</b> eseguibile prima che il risultato diventi rumore;</li>
               <li>la <b>fedeltà delle porte a due qubit</b> (il collo di bottiglia: oggi 99–99,9%, servirebbe di più).</li>
             </ul>
             <div class="callout"><b>Le tecnologie in gara:</b> superconduttori (IBM, Google), ioni intrappolati (IonQ, Quantinuum),
             atomi neutri (QuEra, Pasqal), fotoni (PsiQuantum, Xanadu), spin nel silicio (Intel). Ognuna ha compromessi diversi
             fra velocità, fedeltà, scalabilità e temperatura d'esercizio. <b>Non è ancora chiaro chi vincerà</b>,
             ed è una delle cose più interessanti del settore.</div>`,
    },
    {
      t: '💡 Prova tu',
      html: `<div class="callout think">
        <p><b>1.</b> Perché un errore di fase (Z) è più insidioso di un bit flip? <span class="muted">(perché non cambia nessuna probabilità: è invisibile finché non fa interferenza)</span></p>
        <p><b>2.</b> Se un qubit logico costa 1.000 qubit fisici, quanti servono per i ~4.000 qubit logici stimati per RSA-2048?</p>
        <p><b>3.</b> Nel simulatore, prova a inserire una <b>Z</b> invece di una X nello stato GHZ: le probabilità cambiano?
           E lo stato? <span class="muted">(no e sì: ecco perché serve un codice anche per le fasi)</span></p>
        <p class="mb0"><b>4.</b> Da inventore: esistono algoritmi progettati per <b>convivere</b> con il rumore invece di combatterlo
           (variazionali, ibridi quantistico-classici). Sapresti immaginare che struttura devono avere per essere robusti?</p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'Che cos\'è la decoerenza?',
      options: ['un errore di programmazione', 'la perdita delle relazioni di fase per interazione con l\'ambiente', 'una porta logica', 'il collasso voluto dallo sperimentatore'], correct: 1,
      why: 'L\'ambiente "misura" involontariamente il sistema: la sovrapposizione coerente diventa una mescolanza casuale e l\'interferenza sparisce.' },
    { q: 'Perché non si può correggere l\'errore copiando i qubit?',
      options: ['perché costa troppo', 'per il teorema di no-cloning', 'perché i qubit sono lenti', 'perché la copia sarebbe imprecisa'], correct: 1,
      why: 'Uno stato quantistico sconosciuto non è copiabile. Si usano invece codici che distribuiscono l\'informazione su più qubit e misure di sindrome.' },
    { q: 'La misura di sindrome…',
      options: ['legge il valore dei qubit', 'rivela dove è avvenuto l\'errore senza rivelare l\'informazione', 'cancella lo stato', 'raddoppia i qubit'], correct: 1,
      why: 'Misura relazioni fra qubit ("sono uguali?") invece dei loro valori: individua l\'errore lasciando intatta la sovrapposizione.' },
    { q: 'Un tipo di errore che nel mondo classico non esiste è…',
      options: ['il bit flip', 'il phase flip', 'la perdita di alimentazione', 'il rumore termico'], correct: 1,
      why: 'Il phase flip cambia il segno dell\'ampiezza di |1⟩ senza toccare le probabilità: è invisibile a una misura ma rovina tutte le interferenze successive.' },
  ],

  outro: `<div class="callout ok"><b>Cosa ti porti a casa:</b> il nemico è la decoerenza; non si può copiare, quindi si
          codifica e si misurano <b>sindromi</b>; un qubit logico costa migliaia di qubit fisici; siamo in mezzo al guado,
          né arrivati né bloccati. Adesso il livello che aspettavi: <b>inventa il tuo algoritmo</b>.</div>`,
});
</script>
