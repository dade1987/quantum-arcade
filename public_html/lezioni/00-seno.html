<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0·3 · Seno e coseno — Quantum Arcade</title>
<meta name="description" content="Seno e coseno spiegati senza triangoli: sono le due ombre di un punto che gira su un cerchio. Il ponte fra gradi, onde e formula di Eulero.">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
</head>
<body>
<div id="app"></div>
<script type="module">
import { renderLesson } from '../js/core/lesson.js';
import { stepper } from '../js/core/formula.js';
import { sinCosLab } from '../js/widgets/basicmath.js';

const L = renderLesson({
  id: '00-seno',
  lead: `Seno e coseno hanno la fama di essere roba da liceo con i triangoli. In realtà sono due cose semplicissime:
         <b>le due ombre di un punto che gira</b>. Se capisci questa frase — e alla fine di questo livello la capirai —
         hai in tasca metà del corso.`,

  steps: [
    {
      t: 'Un punto gira e proietta due ombre',
      html: `<p>Prendi il cerchio del livello precedente e metti un punto sul bordo. Il cerchio ha <b>raggio 1</b>
             (una unità: un metro, un centimetro, quello che vuoi).</p>
             <p>Adesso accendi due lampade: una in alto che proietta l'ombra del punto sul pavimento, una di lato che
             la proietta sul muro.</p>
             <ul>
               <li>L'ombra <b>sul pavimento</b> (quanto sei spostato a destra) si chiama <b>coseno</b>.</li>
               <li>L'ombra <b>sul muro</b> (quanto sei in alto) si chiama <b>seno</b>.</li>
             </ul>
             <p>Tutto qui. Non c'è nient'altro da sapere: sono due <b>misure di spostamento</b>, una orizzontale e una verticale,
             di un punto che gira.</p>
             <div class="callout key">Siccome il raggio è 1, seno e coseno stanno <b>sempre</b> fra −1 e +1.
             Non possono valere 3, né 100. Se in un conto ti esce un seno pari a 2, hai sbagliato qualcosa.</div>`,
      mount: (el, api) => {
        const m = api.mission({ key: 'sincos', title: 'Le due ombre', text: 'centra 3 angoli richiesti dalla prova.', xp: 30 });
        el.appendChild(m.root);
        sinCosLab(el, { need: 3, onWin: () => m.complete() });
      },
    },
    {
      t: 'I quattro valori da sapere a memoria',
      html: `<table class="table">
               <tr><th>Angolo</th><th>Dove sei</th><th>coseno (ombra orizzontale)</th><th>seno (altezza)</th></tr>
               <tr><td class="mono">0°</td><td>tutto a destra →</td><td class="mono">1</td><td class="mono">0</td></tr>
               <tr><td class="mono">90°</td><td>in cima ↑</td><td class="mono">0</td><td class="mono">1</td></tr>
               <tr><td class="mono">180°</td><td>tutto a sinistra ←</td><td class="mono">−1</td><td class="mono">0</td></tr>
               <tr><td class="mono">270°</td><td>in fondo ↓</td><td class="mono">0</td><td class="mono">−1</td></tr>
             </table>
             <p>Nota il ritmo: quando uno vale 1 o −1, l'altro vale 0. Si "danno il cambio". E c'è un valore speciale
             che incontrerai ovunque nel corso:</p>
             <div class="formula">cos 45° = sin 45° = <span class="hl-n">1/√2</span> ≈ 0,707</div>
             <p>A 45° sei esattamente a metà strada fra "tutto a destra" e "tutto in alto": le due ombre sono uguali.
             E ricorda dal livello 0·1: <b>(0,707)² = 0,5</b>, cioè il 50%. Questo numero descriverà il qubit "a metà fra 0 e 1".</p>`,
      mount: el => {
        stepper(el, [
          { h: 'Domanda', html: 'A 90° quanto vale il <b>coseno</b>?' },
          { h: 'Risposta', html: 'Vale <b>0</b>. A 90° sei in cima al cerchio: non sei spostato né a destra né a sinistra, quindi l\'ombra orizzontale è nulla. Il seno invece vale 1 (sei alto quanto il raggio).' },
          { h: 'Domanda', html: 'E a 180°, quanto vale il <b>seno</b>?' },
          { h: 'Risposta', html: '<b>0</b>. Sei tutto a sinistra, all\'altezza del centro: nessuna altezza. Il coseno invece vale −1 (spostato a sinistra di tutto il raggio).' },
          { h: 'Domanda difficile', html: 'Perché a 270° il seno vale <b>−1</b> e non 1?' },
          { h: 'Risposta', html: 'Perché a 270° sei <b>sotto</b> il centro. L\'altezza si misura con segno: sopra è positiva, sotto è negativa. Esattamente come i numeri negativi sulla linea del livello 0·1.' },
        ], { doneLabel: 'Chiaro!' });
      },
    },
    {
      t: 'Da qui nascono le onde (e quindi tutto il resto)',
      html: `<p>Nel gioco, a destra, hai già visto la parte importante: se il punto <b>continua a girare</b> e disegni
             la sua altezza mentre il tempo passa, esce una <b>curva ondulata</b>. Quella curva è l'onda del seno.</p>
             <p>E il coseno? È la stessa identica curva, solo <b>partita 90° prima</b>. Coseno e seno sono gemelli sfasati.</p>
             <div class="callout key"><b>Il ponte con tutto il corso:</b>
             <ul style="margin:8px 0 0">
               <li>punto che gira → <b>seno e coseno</b> (questo livello)</li>
               <li>seno e coseno nel tempo → <b>onde</b> (livello 12)</li>
               <li>onde spostate fra loro → <b>fase</b> (livello 13)</li>
               <li>lunghezza + angolo di una freccia → <b>numeri complessi</b> ed <b>e^{iθ} = cos θ + i·sin θ</b> (livello 8)</li>
               <li>frecce che si sommano o si cancellano → <b>interferenza</b> (livello 7) e <b>Fourier</b> (livello 15)</li>
             </ul>
             Nessun salto: è una catena sola, e il primo anello è il punto che gira.</div>`,
    },
    {
      t: '💡 Prova tu',
      html: `<div class="callout think">
        <p><b>1.</b> Esiste un angolo in cui seno e coseno sono <b>entrambi</b> negativi? Trovalo nel gioco.</p>
        <p><b>2.</b> Quanto vale cos 360°? E cos 720°? Perché?</p>
        <p><b>3.</b> Prova a fare il conto: (cos 45°)² + (sin 45°)² = 0,5 + 0,5 = <b>1</b>. Prova con altri angoli:
           viene sempre 1. Sai dire perché? <span class="muted">(indizio: Pitagora su un raggio lungo 1)</span></p>
        <p class="mb0"><b>4.</b> Quella regola — <b>cos² + sin² = 1</b> — nel mondo quantistico diventerà
           "la somma delle probabilità fa 100%". Non è una coincidenza.</p>
      </div>`,
    },
  ],

  quiz: [
    { q: 'Il seno di un angolo rappresenta…', options: ['la lunghezza della freccia', 'quanto il punto è in alto', 'quanto il punto è a destra', 'l\'angolo in gradi'], correct: 1,
      why: 'Il seno è l\'altezza (proiezione verticale) del punto sul cerchio di raggio 1; il coseno è lo spostamento orizzontale.' },
    { q: 'Quanto vale cos 180°?', options: ['1', '0', '−1', '180'], correct: 2,
      why: 'A 180° il punto è tutto a sinistra: spostamento orizzontale −1 (e altezza 0).' },
    { q: 'Seno e coseno possono valere 1,5?', options: ['sì, se l\'angolo è grande', 'no, stanno sempre fra −1 e 1', 'solo il seno', 'solo per angoli negativi'], correct: 1,
      why: 'Sono proiezioni su un cerchio di raggio 1: non possono superare il raggio.' },
    { q: 'Perché cos 45° = sin 45°?', options: ['per caso', 'perché a 45° si è ugualmente spostati a destra e in alto', 'perché 45 è metà di 90', 'non è vero'], correct: 1,
      why: 'A 45° si è esattamente a metà strada fra l\'asse orizzontale e quello verticale: le due ombre sono identiche e valgono 1/√2 ≈ 0,707.' },
  ],

  outro: `<div class="callout ok"><b>Fatto!</b> Seno e coseno non sono più due parole misteriose: sono le due ombre
          di un punto che gira. Ultimo livello di base: il <b>caso</b>, cioè le probabilità — perché ogni misura
          quantistica è, in fondo, un lancio di moneta molto ben organizzato.</div>`,
});
</script>
</body>
</html>
